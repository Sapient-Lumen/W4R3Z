name: DatacubeSQLite rev1228 inspection

on:
  push:
    branches:
      - datacubesqlite-rev1228-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            Maintained Tools/Datacube
            .github
          sparse-checkout-cone-mode: false

      - name: Inspect rev1227 through its native routes
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_WORKSPACE"
          work="$RUNNER_TEMP/datacubesqlite-inspect"
          pair="$work/pair"
          op="$work/operations"
          mkdir -p "$pair" "$op"
          cp "$repo/Maintained Tools/Datacube/datacube" "$pair/datacube"
          cp "$repo/Maintained Tools/Datacube/BOOTSTRAPROSE.md" "$pair/BOOTSTRAPROSE.md"
          chmod 0555 "$pair/datacube" "$pair/BOOTSTRAPROSE.md"
          cd "$pair"

          echo '=== PAIR ==='
          stat -c '%n mode=%a bytes=%s links=%h' datacube BOOTSTRAPROSE.md
          sha256sum datacube BOOTSTRAPROSE.md
          file datacube

          echo '=== LINKED VERIFY ==='
          ./BOOTSTRAPROSE.md linked-verify

          echo '=== RUN ==='
          ./BOOTSTRAPROSE.md run

          echo '=== INSPECT ==='
          ./datacube inspect

          echo '=== TRANSFORM INSPECT ==='
          ./datacube transform-inspect || true

          echo '=== NATIVE HELP ==='
          ./datacube help || ./datacube --help || true

          echo '=== SOURCE LIST ==='
          ./datacube source-list

          echo '=== PROJECT KEY FILES ==='
          ./datacube project-list | grep -E '(^|/)(OPERATIVE|CONTINUATION-GUIDE|DELIVERY-CONTRACT|DOCUMENTARY-DOCKET|README|BUILD|CMakeLists|Makefile|ROADMAP|ARCHITECTURE|DESIGN|TEST).*' || true

          nonce_source='1111111111111111111111111111111111111111111111111111111111111111'
          nonce_project='2222222222222222222222222222222222222222222222222222222222222222'
          ./datacube source-materialize --operation-root "$op" source "$nonce_source"
          ./datacube project-materialize --operation-root "$op" project "$nonce_project"

          src="$op/source"
          project="$op/project"

          echo '=== SOURCE TREE ==='
          find "$src" -type f -printf '%P\n' | sort

          echo '=== SOURCE README ==='
          cat "$src/README.md"

          echo '=== SOURCE BUILD ==='
          cat "$src/BUILD.txt"

          echo '=== EDIT TRANSACTION HEADER ==='
          sed -n '1,2600p' "$src/include/datacube/edit_transaction.hpp"

          echo '=== CONSTRUCTOR REFERENCES ==='
          grep -RInE 'candidate-build|successor|bootstrap-render|pack-linked|constructor|linked_revision|release_filename' "$src" | head -n 800 || true

          echo '=== PROJECT OPERATIVE ==='
          cat "$project/.datacube/OPERATIVE.md"

          echo '=== PROJECT CONTINUATION ==='
          cat "$project/.datacube/CONTINUATION-GUIDE.md"

          echo '=== PROJECT DELIVERY CONTRACT ==='
          cat "$project/.datacube/DELIVERY-CONTRACT.md"

          echo '=== PROJECT DOCUMENTARY DOCKET ==='
          cat "$project/.datacube/DOCUMENTARY-DOCKET.md"

          echo '=== PROJECT ROOT ==='
          find "$project" -maxdepth 2 -type f -printf '%P\n' | sort | head -n 1000

          echo '=== TOOLCHAIN ==='
          g++ --version | head -n 1
          clang++ --version | head -n 1
          ld --version | head -n 1
          pkg-config --modversion libzstd || true
