name: sandpi rev0089 recovery

on:
  push:
    branches:
      - sandpi-rev0089-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            Maintained Tools/sandpi
          sparse-checkout-cone-mode: false

      - name: Verify carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0755 'Maintained Tools/sandpi' sandpi-rev0086
          stat -c '%n mode=%a bytes=%s links=%h' sandpi-rev0086
          sha256sum sandpi-rev0086 | tee sandpi-rev0086.sha256
          head -n 14 sandpi-rev0086

      - name: Upload exact carrier
        uses: actions/upload-artifact@v4
        with:
          name: sandpi-rev0086-carrier
          path: |
            sandpi-rev0086
            sandpi-rev0086.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
