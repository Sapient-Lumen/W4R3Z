name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, clang-debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2
      - name: Test
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure

  toxsync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S components/toxsync -B build/toxsync -DTOXSYNC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/toxsync --parallel 2
      - name: Test
        run: ctest --test-dir build/toxsync --output-on-failure

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install coverage dependencies
        run: sudo apt-get update && sudo apt-get install -y gcovr libsodium23
      - name: Build, test, and enforce product coverage
        run: ./tools/coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/coverage-report

  repeated-process-lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime provider
        run: sudo apt-get update && sudo apt-get install -y libsodium23
      - name: Configure and build
        run: cmake --preset gcc-debug && cmake --build --preset gcc-debug --parallel 2
      - name: Repeat the cross-process fixture
        run: ./tools/repeat-tests.sh gcc-debug 20 '^iotox\.binary-process-lifecycle$'

  source-linked-standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .deps/cache
            .deps/src
          key: iotox-source-deps-${{ runner.os }}-${{ hashFiles('dependencies.lock') }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config
      - name: Build and verify pinned source-linked product
        run: IOTOX_JOBS=2 IOTOX_PACKAGE_SOURCES=1 ./tools/build-standalone.sh
      - name: Verify clean same-builder distribution reproducibility
        run: >-
          IOTOX_REPRO_BASELINE_DIR="$PWD/dist/standalone"
          IOTOX_JOBS=2
          ./tools/compare-standalone-builds.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iotox-source-linked-standalone
          path: dist/standalone
