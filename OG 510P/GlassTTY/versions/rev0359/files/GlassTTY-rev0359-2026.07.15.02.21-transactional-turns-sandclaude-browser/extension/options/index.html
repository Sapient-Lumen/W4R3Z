<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlassTTY Options</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        max-width: 72rem;
        margin: 2rem auto;
        padding: 0 1rem 3rem;
        line-height: 1.5;
      }
      .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); }
      .card { border: 1px solid rgba(127,127,127,0.3); border-radius: 16px; padding: 1rem; }
      pre, code { white-space: pre-wrap; word-break: break-word; }
      textarea { width: 100%; min-height: 8rem; box-sizing: border-box; }
      button { padding: 0.5rem 0.8rem; border-radius: 10px; }
      .muted { opacity: 0.8; }
    </style>
  </head>
  <body>
    <h1>GlassTTY Options</h1>
    <p class="muted">Chromium-first browser-to-terminal bridge. ChatGPT-only adapter.</p>
    <div class="grid">
      <section class="card">
        <h2>Extension</h2>
        <pre id="extension-meta">Loading…</pre>
      </section>
      <section class="card">
        <h2>Bridge status</h2>
        <pre id="bridge-status">Loading…</pre>
      </section>
      <section class="card">
        <h2>Adapter registry</h2>
        <pre id="adapter-registry">Loading…</pre>
      </section>
      <section class="card">
        <h2>Native host install helper</h2>
        <p>Copy the computed extension ID into your install command if you are not using <code>--extension-id auto</code>.</p>
        <textarea id="install-command" readonly></textarea>
      </section>
    </div>
    <p><button id="refresh" type="button">Refresh</button></p>
    <script type="module" src="../dist/options/main.js"></script>
  </body>
</html>
