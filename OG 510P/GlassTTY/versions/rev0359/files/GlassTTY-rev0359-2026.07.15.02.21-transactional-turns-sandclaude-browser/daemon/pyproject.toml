[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glassttyd"
version = "0.1.12"
description = "GlassTTY native host, broker, conversation engine, and CLI"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "GlassTTY" }]
# rev0353: jsonschema was already a hard requirement of the proof-validation
# path (chatgpt_first_proof_schema_validation) but was never declared. On a
# clean install it failed the import guard, schema_validation_ok went false, and
# five tests failed with no obvious cause. Declared so it installs with the tool.
dependencies = ["jsonschema>=4.0"]

[project.scripts]
glassttyd = "glassttyd.cli:main"
glasstty-native-host = "glassttyd.native_host:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
