<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlassTTY Side Panel</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem;
        background: #0f1115;
        color: #f4f5f8;
      }
      h1, h2 { margin: 0 0 0.75rem; }
      h1 { font-size: 1.1rem; }
      h2 { font-size: 0.95rem; }
      .stack { display: grid; gap: 0.9rem; }
      .card {
        background: #171a21;
        border: 1px solid rgba(255,255,255,0.09);
        border-radius: 14px;
        padding: 0.85rem;
      }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      button {
        border: 1px solid rgba(255,255,255,0.18);
        background: #242a36;
        color: inherit;
        border-radius: 10px;
        padding: 0.5rem 0.7rem;
        cursor: pointer;
      }
      textarea {
        width: 100%;
        min-height: 6rem;
        box-sizing: border-box;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.18);
        background: #0f1115;
        color: inherit;
        padding: 0.75rem;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
        font-size: 0.82rem;
      }
      .list { display: grid; gap: 0.5rem; }
      .tab-row {
        display: grid;
        gap: 0.2rem;
        padding: 0.45rem 0.2rem;
      }
      small, em { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="stack">
      <section class="card">
        <h1>GlassTTY</h1>
        <div class="row">
          <button id="refresh-status" type="button">Refresh</button>
          <button id="read-prompt" type="button">Read prompt</button>
          <button id="read-latest" type="button">Read latest</button>
          <button id="snapshot" type="button">Snapshot</button>
          <button id="contexts" type="button">Contexts</button>
          <button id="trace" type="button">Trace</button>
          <button id="debug" type="button">Debug candidates</button>
          <button id="capture-fixture" type="button">Capture fixture</button>
        </div>
      </section>
      <section class="card">
        <h2>Write prompt</h2>
        <textarea id="prompt-draft" placeholder="Draft text to write into the selected browser prompt"></textarea>
        <div class="row" style="margin-top:0.75rem;">
          <button id="write-prompt" type="button">Write</button>
          <button id="submit-prompt" type="button">Submit</button>
        </div>
      </section>
      <div id="app"></div>
      <section class="card">
        <h2>Last response</h2>
        <pre id="last-response">No request yet.</pre>
      </section>
    </div>
    <script type="module" src="../dist/sidepanel/main.js"></script>
  </body>
</html>
