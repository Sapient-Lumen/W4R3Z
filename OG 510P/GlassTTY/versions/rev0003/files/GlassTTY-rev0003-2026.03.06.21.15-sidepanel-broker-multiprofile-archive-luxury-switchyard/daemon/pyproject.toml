[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glassttyd"
version = "0.0.3"
description = "GlassTTY native host, broker, and CLI"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "GlassTTY" }]
dependencies = []

[project.scripts]
glassttyd = "glassttyd.cli:main"
glasstty-native-host = "glassttyd.native_host:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
