<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GlassTTY Side Panel</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem;
        background: #111827;
        color: #f9fafb;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      button {
        background: #2563eb;
        color: white;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
      }
      .card {
        background: #1f2937;
        border-radius: 1rem;
        padding: 0.75rem;
        margin-bottom: 0.75rem;
        box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #0b1220;
        padding: 0.75rem;
        border-radius: 0.75rem;
        overflow: auto;
      }
      h1, h2 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <h1>GlassTTY</h1>
    <div class="row">
      <button id="refresh-status">Refresh status</button>
      <button id="read-prompt">Read prompt</button>
      <button id="read-latest">Read latest</button>
      <button id="snapshot">Snapshot</button>
      <button id="debug">Debug DOM</button>
    </div>
    <div id="app"></div>
    <section class="card">
      <h2>Last response</h2>
      <pre id="last-response">(none yet)</pre>
    </section>
    <script type="module" src="../dist/sidepanel/main.js"></script>
  </body>
</html>
