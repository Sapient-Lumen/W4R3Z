- ntpq_observation_path: system.stratum
  rfc9249_reference: /ntp/clock-state/system-status/clock-stratum
  decision: direct_map
  unit_or_semantic_note: NTP stratum 1..15 is usable; 16 or invalid remains fail-closed in the evaluator.
  core_promotion: forbidden
- ntpq_observation_path: system.reference_id
  rfc9249_reference: /ntp/clock-state/system-status/clock-refid
  decision: direct_map
  unit_or_semantic_note: ntpq refid identifies the selected system reference; interpretation still depends on stratum and implementation output.
  core_promotion: forbidden
- ntpq_observation_path: system.system_time_offset_seconds
  rfc9249_reference: /ntp/clock-state/system-status/clock-offset
  decision: partial_map
  unit_or_semantic_note: ntpq readvar displays offset in milliseconds; the TimeSync observation stores seconds and keeps sign only for explanation, not interval narrowing.
  core_promotion: forbidden
- ntpq_observation_path: system.root_delay_seconds
  rfc9249_reference: /ntp/clock-state/system-status/root-delay
  decision: partial_map
  unit_or_semantic_note: ntpq readvar displays rootdelay in milliseconds; TimeSync stores seconds and clamps negative delay contribution to zero for conservative bounds.
  core_promotion: forbidden
- ntpq_observation_path: system.root_dispersion_seconds
  rfc9249_reference: /ntp/clock-state/system-status/root-dispersion
  decision: partial_map
  unit_or_semantic_note: ntpq readvar displays rootdisp in milliseconds; TimeSync stores seconds for exact evaluator arithmetic.
  core_promotion: forbidden
- ntpq_observation_path: system.ref_time_utc
  rfc9249_reference: /ntp/clock-state/system-status/reference-time
  decision: partial_map
  unit_or_semantic_note: ntpq reftime is converted from readvar text to RFC 3339 UTC, but TimeSync does not prove a named UTC realization.
  core_promotion: forbidden
- ntpq_observation_path: system.leap
  rfc9249_reference: /ntp/clock-state/system-status/clock-state plus /ntp/clock-state/system-status/sync-state
  decision: partial_map
  unit_or_semantic_note: ntpq leap=00 is treated as normal; leap alarm/unsynchronized states fail closed rather than creating a new TimeState field.
  core_promotion: forbidden
- ntpq_observation_path: system.clk_wander_ppm
  rfc9249_reference: /ntp/clock-state/system-status/nominal-freq and /ntp/clock-state/system-status/actual-freq
  decision: gap
  unit_or_semantic_note: ntpq clk_wander is an implementation-reported oscillator wander estimate in ppm used only for holdover growth.
  core_promotion: forbidden
- ntpq_observation_path: peers_summary.states[].tally
  rfc9249_reference: /ntp/associations/association plus /ntp/clock-state/system-status/associations-*
  decision: gap
  unit_or_semantic_note: ntpq peer tally symbols are implementation-specific selection summaries; source_posture is assessed locally, not promoted.
  core_promotion: forbidden
- ntpq_observation_path: peers_summary.states[].reach
  rfc9249_reference: /ntp/associations/association/reach
  decision: partial_map
  unit_or_semantic_note: ntpq peer billboard reach is retained as association evidence, but the P1 evaluator uses it only through the peer selection summary.
  core_promotion: forbidden
- ntpq_observation_path: authentication_summary.reported_packet_authentication
  rfc9249_reference: none
  decision: adapter_local
  unit_or_semantic_note: The ntpq replay adapter records authentication as not observed and does not convert absence of evidence into proof of unauthenticated or authenticated packets.
  core_promotion: forbidden
