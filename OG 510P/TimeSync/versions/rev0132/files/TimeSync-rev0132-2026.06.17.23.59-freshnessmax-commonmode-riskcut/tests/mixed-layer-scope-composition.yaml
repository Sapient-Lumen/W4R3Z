matrix_version: rev0090
matrix_digest:
  algorithm: sha256
  value: '9090909090909090909090909090909090909090909090909090909090909090'
  binds: scope_composition_decision_matrix
rows:
- row_id: safe-separated-mixed-layer-current-guarded
  attack_pattern: safe_separated_surfaces
  required_surfaces:
  - profile_compatibility_drift
  - discovery_version_negotiation
  - discovery_digest_binding
  - aggregate_correction_authority_lifecycle
  - aggregate_lifecycle_rollup
  - transparency_trust_policy_lifecycle
  safe_guard_effect: current_use_guarded
  unsafe_upgrade_blocked: true
  failure_mode: none
  note: All surfaces are current-use allowed in their own scope; the guard still cannot
    update TimeState, profile assessment, or actionability.
- row_id: downgrade-cannot-bypass-lifecycle-suppression
  attack_pattern: downgrade_bypasses_lifecycle_suppression
  required_surfaces:
  - discovery_version_negotiation
  - aggregate_correction_authority_lifecycle
  safe_guard_effect: suppressed
  unsafe_upgrade_blocked: true
  failure_mode: lifecycle_suppressed
  note: A valid downgrade proof cannot reopen a suppressed aggregate lifecycle interpretation.
- row_id: lifecycle-rollup-cannot-bypass-profile-drift
  attack_pattern: lifecycle_rollup_bypasses_profile_drift
  required_surfaces:
  - aggregate_lifecycle_rollup
  - profile_compatibility_drift
  safe_guard_effect: suppressed
  unsafe_upgrade_blocked: true
  failure_mode: profile_drift_not_current
  note: Current aggregate lifecycle counts cannot make weaker or unknown profile drift
    current.
- row_id: transparency-policy-equivalence-cannot-reopen-profile-assessment
  attack_pattern: transparency_policy_equivalence_reopens_profile_assessment
  required_surfaces:
  - transparency_policy_equivalence
  - transparency_trust_policy_lifecycle
  safe_guard_effect: fail_closed
  unsafe_upgrade_blocked: true
  failure_mode: profile_assessment_update_attempt
  note: Replay policy equivalence remains replay-visibility-only and cannot reopen
    profile assessment.
- row_id: aggregate-rollup-cannot-update-actionability
  attack_pattern: aggregate_rollup_updates_actionability
  required_surfaces:
  - aggregate_lifecycle_rollup
  - aggregate_correction_authority_lifecycle
  safe_guard_effect: fail_closed
  unsafe_upgrade_blocked: true
  failure_mode: actionability_update_attempt
  note: Aggregate-only lifecycle summaries cannot become current actionability evidence.
- row_id: unknown-newer-version-metadata-only
  attack_pattern: unknown_newer_result_becomes_current
  required_surfaces:
  - discovery_version_negotiation
  safe_guard_effect: metadata_only
  unsafe_upgrade_blocked: true
  failure_mode: unknown_newer_version
  note: Unknown newer discovery results remain metadata-only unless an equivalent
    supported interpretation is proven.
- row_id: digest-binding-cannot-become-profile-evidence
  attack_pattern: digest_binding_reinterpreted_as_profile_evidence
  required_surfaces:
  - discovery_digest_binding
  - portable_digest_binding_policy
  safe_guard_effect: fail_closed
  unsafe_upgrade_blocked: true
  failure_mode: digest_binding_profile_evidence_attempt
  note: Digest-binding policy explains how bytes are bound; it does not satisfy profile
    obligations.
- row_id: stale-composed-input-cannot-remain-current
  attack_pattern: stale_composed_input_remains_current
  required_surfaces:
  - profile_compatibility_drift
  - discovery_version_negotiation
  - aggregate_correction_authority_lifecycle
  - transparency_trust_policy_lifecycle
  safe_guard_effect: fail_closed
  unsafe_upgrade_blocked: true
  failure_mode: stale_or_unchecked_temporal_input
  note: Even when each surface is valid in isolation, a mixed-layer current guard
    fails closed if any current input is stale, unchecked, or outside the declared
    evaluation window.
