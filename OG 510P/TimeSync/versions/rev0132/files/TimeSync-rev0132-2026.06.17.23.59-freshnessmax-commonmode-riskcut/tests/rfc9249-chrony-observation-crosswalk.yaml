- chrony_observation_path: tracking.stratum
  rfc9249_reference: /ntp/clock-state/system-status/clock-stratum
  decision: direct_map
  unit_or_semantic_note: NTP stratum 1..15 is usable; 16 or invalid remains fail-closed in the evaluator.
  core_promotion: forbidden
- chrony_observation_path: tracking.reference_id
  rfc9249_reference: /ntp/clock-state/system-status/clock-refid
  decision: direct_map
  unit_or_semantic_note: Both identify the selected reference source, with interpretation dependent on stratum.
  core_promotion: forbidden
- chrony_observation_path: tracking.system_time_offset_seconds
  rfc9249_reference: /ntp/clock-state/system-status/clock-offset
  decision: partial_map
  unit_or_semantic_note: RFC 9249 reports milliseconds; chrony observation stores seconds and keeps sign only for explanation, not interval narrowing.
  core_promotion: forbidden
- chrony_observation_path: tracking.root_delay_seconds
  rfc9249_reference: /ntp/clock-state/system-status/root-delay
  decision: partial_map
  unit_or_semantic_note: RFC 9249 reports milliseconds; TimeSync stores seconds and clamps negative delay contribution to zero for conservative bounds.
  core_promotion: forbidden
- chrony_observation_path: tracking.root_dispersion_seconds
  rfc9249_reference: /ntp/clock-state/system-status/root-dispersion
  decision: partial_map
  unit_or_semantic_note: RFC 9249 reports milliseconds; TimeSync stores seconds for exact evaluator arithmetic.
  core_promotion: forbidden
- chrony_observation_path: tracking.ref_time_utc
  rfc9249_reference: /ntp/clock-state/system-status/reference-time
  decision: partial_map
  unit_or_semantic_note: Both identify reference/correction time; TimeSync preserves UTC string but does not prove named UTC realization.
  core_promotion: forbidden
- chrony_observation_path: tracking.leap_status
  rfc9249_reference: /ntp/clock-state/system-status/clock-state plus /ntp/clock-state/system-status/sync-state
  decision: gap
  unit_or_semantic_note: RFC 9249 exposes synchronized/sync-state, but not chronyc Leap status text as a direct leaf; non-Normal leap status fails closed.
  core_promotion: forbidden
- chrony_observation_path: tracking.skew_ppm
  rfc9249_reference: /ntp/clock-state/system-status/nominal-freq and /ntp/clock-state/system-status/actual-freq
  decision: gap
  unit_or_semantic_note: RFC 9249 has clock frequency fields in Hz; chronyc Skew is an estimator uncertainty in ppm used only for holdover growth.
  core_promotion: forbidden
- chrony_observation_path: sources_summary.states[].state
  rfc9249_reference: /ntp/associations/association plus /ntp/clock-state/system-status/associations-*
  decision: gap
  unit_or_semantic_note: chronyc source selection symbols are implementation-specific summaries; source_posture is therefore assessed, not promoted.
  core_promotion: forbidden
- chrony_observation_path: sources_summary.states[].reach
  rfc9249_reference: /ntp/associations/association/reach
  decision: partial_map
  unit_or_semantic_note: RFC 9249 has reach in association state; current chrony observation summary omits raw reach except in parsed source rows.
  core_promotion: forbidden
- chrony_observation_path: capture_context.monotonic_duration_ns
  rfc9249_reference: none
  decision: adapter_local
  unit_or_semantic_note: Local capture ordering evidence is outside NTP operational state and must remain adapter evidence, not a TimeState field.
  core_promotion: forbidden
- chrony_observation_path: capture_context.chronyc_version_stdout
  rfc9249_reference: none
  decision: adapter_local
  unit_or_semantic_note: Tool-version evidence improves replay diagnosis but does not affect the six-field core.
  core_promotion: forbidden
- chrony_observation_path: sourcestats_summary.rows[].freq_skew_ppm
  rfc9249_reference: /ntp/associations/association/statistics or implementation-specific estimation state
  decision: gap
  unit_or_semantic_note: chronyc sourcestats Freq Skew is per-source regression estimator uncertainty in ppm; it is captured for diagnostics but not promoted into TimeState or P1 policy.
  core_promotion: forbidden
- chrony_observation_path: sourcestats_summary.rows[].std_dev_seconds
  rfc9249_reference: /ntp/associations/association/statistics or implementation-specific estimation state
  decision: gap
  unit_or_semantic_note: chronyc sourcestats Std Dev is per-source sample dispersion from chronyd's estimator; TimeSync stores seconds and keeps it adapter-local.
  core_promotion: forbidden
- chrony_observation_path: authentication_summary.authdata_rows[].mode
  rfc9249_reference: none
  decision: adapter_local
  unit_or_semantic_note: chronyc authdata reports the local client's observed NTP authentication mode such as NTS, SK, or disabled; TimeSync records it only as reported diagnostics and does not promote it into source_posture.
  core_promotion: forbidden
- chrony_observation_path: authentication_summary.ntpdata_blocks[].authenticated
  rfc9249_reference: none
  decision: adapter_local
  unit_or_semantic_note: chronyc ntpdata reports whether the last valid NTP measurement was authenticated; TimeSync does not independently verify packets, AEAD tags, cookies, certificates, or symmetric keys in this evaluator.
  core_promotion: forbidden
