- id: AT-001
  name: minimal timestate remains six fields
  given:
  - a local assessed state is exported without profile-specific pressure
  when:
  - the state carries interval, timescale, freshness, regime, source_posture, and
    applicability
  then:
  - it is complete at the invariant core layer
  - absence of source roster, audit log, profile manifest, or phase/frequency detail
    is not a core failure
- id: AT-002
  name: wire claim stays thinner than local assessed state
  given:
  - a source sends interval_claim, timescale_claim, and identity_or_auth_proof
  when:
  - the receiver computes freshness, regime, source_posture, and applicability
  then:
  - the receiver exports those as local assessed state
  - the source packet is not treated as carrying local profile_conformance
- id: AT-003
  name: missing profile-required default blocks satisfaction
  given:
  - an active profile defaults traceability_posture at its boundary
  when:
  - the response omits traceability_posture
  then:
  - the exchange may remain parseable
  - profile_conformance is not satisfied by default
  - hook-dependent stronger applicability is withdrawn or weakened
  - fallback is allowed only if the profile defines it
- id: AT-004
  name: requested optional absence is item-level accounting
  given:
  - sync_dimension is requestable but not required for the active profile
  when:
  - a requester asks for sync_dimension and the response cannot provide it
  then:
  - a result-capable response reports unavailable, unknown, or omitted
  - this does not automatically imply profile_conformance is unsatisfied
- id: AT-005
  name: unknown hook does not preserve stronger applicability
  given:
  - a stronger applicability label depends on traceability_posture
  when:
  - traceability_posture becomes unknown
  then:
  - the stronger traceability-dependent applicability is no longer asserted by default
  - a profile-defined weaker fallback may be exported
- id: AT-006
  name: fallback must not be bare
  given:
  - full profile satisfaction fails but a profile-defined weaker mode applies
  when:
  - profile_conformance is exported as fallback
  then:
  - applicability carries an explicit non-stronger use boundary
  - if no safe lower applicability exists, export unsatisfied or local diagnostic
    state
- id: AT-007
  name: profile conformance requires assessed profile on export
  given:
  - profile_conformance crosses a mixed, relayed, audited, or detached boundary
  when:
  - the receiver cannot resolve the assessed profile
  then:
  - the conformance marker is not actionable
  - a sealed single-profile boundary may provide profile identity by authenticated
    context
- id: AT-008
  name: profile reference strength is boundary-tiered
  given:
  - an assessed state is retained for audit
  when:
  - exact profile rules must be reconstructed later
  then:
  - assessed_profile includes authority, id, version or revision, and digest
  - signed binding is added only when issuer or binding verification is independently
    required
- id: AT-009
  name: digest binds profile rules only
  given:
  - assessed_profile includes a digest
  when:
  - the record is interpreted
  then:
  - the digest is understood to bind normative profile rules
  - it is not read as a source packet hash, PDF hash, alias hash, compliance certificate,
    or whole standards catalog hash
- id: AT-010
  name: relay restatement is explicit
  given:
  - a relay terminates upstream timing flow and creates downstream assessed state
  when:
  - the relay exports local assessed state
  then:
  - boundary_context.action is restate
  - the relay does not upgrade fallback or unsatisfied to satisfied without new evidence
    and profile rules
- id: AT-011
  name: boundary context expires with assessed state
  given:
  - boundary_context explains a downgrade caused by loss
  when:
  - the local assessed state expires or is replaced
  then:
  - the boundary_context expires with it
  - no independent provenance lifetime is implied
- id: AT-012
  name: operator aliases are local only
  given:
  - an operator defines alias safe_minimal_status
  when:
  - a shared exchange is sent
  then:
  - the alias has already expanded to explicit item names
  - item-level statuses remain visible
- id: AT-013
  name: ordinary requests are exchange scoped
  given:
  - a request asks for boundary_context
  when:
  - the exchange completes
  then:
  - the request does not become sticky
  - future exchanges need a new request unless a profile/default or lease says otherwise
- id: AT-014
  name: multiple profile assessments remain scoped
  given:
  - one local assessed state is evaluated against P1 and P3
  when:
  - P1 fallback applies and P3 is unsatisfied
  then:
  - both results may be exported as separate profile_assessments
  - no universal conformance value is inferred
- id: AT-015
  name: retained assessment keeps historical conformance
  given:
  - a retained record was assessed as satisfied under P3 version 0.9.0 at assessment_time
  when:
  - P3 version 0.9.0 is later superseded
  then:
  - historical profile_conformance is not rewritten
  - current policy acceptance is evaluated separately
- id: AT-016
  name: current policy rejection blocks action without rewriting history
  given:
  - a retained assessment has profile_lifecycle_state revoked
  when:
  - current policy rejects that profile
  then:
  - policy_acceptance.status is rejected
  - the historical assessment may remain a record
  - the state is not exported as currently actionable
- id: AT-017
  name: reassessment creates a new entry
  given:
  - new evidence or a new profile version is available
  when:
  - the system reassesses old timing data
  then:
  - a new profile_assessment entry is created
  - the old entry is not silently edited
- id: AT-018
  name: signed profile binding is not certification
  given:
  - assessed_profile contains a signed profile-binding record
  when:
  - the receiver verifies the signature
  then:
  - the receiver knows who bound the profile reference
  - the signature alone does not prove the clock satisfied the profile
- id: AT-019
  name: applicability label is interpreted through assessed profile
  given:
  - an exported profile_assessment carries applicability internal_recordkeeping
  when:
  - the assessed_profile is P3-traceable-finance
  then:
  - the label is interpreted using the P3 applicability map
  - no cross-profile meaning is inferred from the string alone
- id: AT-020
  name: fallback target must exist in profile map
  given:
  - profile_conformance is fallback
  when:
  - the exported applicability is not the target of a fallback mapping in the assessed
    profile
  then:
  - the fallback is semantically invalid for that profile boundary
- id: AT-021
  name: fallback target is non-stronger by profile-local rank
  given:
  - a profile map assigns ranks to applicability labels
  when:
  - a fallback mapping is defined
  then:
  - the target rank is less than or equal to the source rank inside that same profile
    map
- id: AT-022
  name: equal label text across profiles is not equality of meaning
  given:
  - two profiles reuse a diagnostic_local_only label
  when:
  - the label is exported
  then:
  - the receiver interprets it through assessed_profile
  - the receiver does not infer a global equivalence class
- id: AT-023
  name: profile default hooks are checked for satisfied conformance
  given:
  - P3 defaults traceability_posture and sync_dimension
  when:
  - a P3 assessment claims satisfied without those hooks
  then:
  - semantic validation rejects satisfied conformance for that fixture
- id: AT-024
  name: boundary-context-required fallback must include boundary context
  given:
  - a profile fallback mapping has boundary_context_required true
  when:
  - state exports fallback target for that mapping
  then:
  - boundary_context is present or the fallback is semantically incomplete
- id: AT-025
  name: policy rejection cannot remain actionable
  given:
  - policy_acceptance.status is rejected
  when:
  - policy_acceptance.actionability is present
  then:
  - actionability is record_only, not_actionable, or unknown
- id: AT-026
  name: accepted with conditions explains the condition
  given:
  - policy_acceptance.status is accepted_with_conditions
  when:
  - the assessment is exported
  then:
  - reason, policy_reference, or actionability explains the condition
- id: AT-027
  name: retained high-strength profile expects digest
  given:
  - a retained or audit-sensitive assessment uses a profile whose reference policy
    minimum tier is 3
  when:
  - the assessment is exported detached or retained
  then:
  - assessed_profile includes a digest binding normative_profile_rules
- id: AT-028
  name: semantic negative fixtures must fail
  given:
  - tests/semantic-test-vectors.yaml marks a fixture fail_schema or fail_semantic
  when:
  - the validator runs
  then:
  - accepting that fixture is itself a validation failure
- id: AT-029
  name: profile catalog digest binds normative rule object
  given:
  - a profile map contains normative_rules_digest
  when:
  - the digest is recomputed over the canonical rule object excluding the digest field
  then:
  - the recomputed value matches
- id: AT-030
  name: interval order is semantic not only schema shape
  given:
  - earliest and latest are both syntactically valid date-times
  when:
  - earliest is after latest
  then:
  - semantic validation rejects the state
- id: AT-031
  name: discovery returned result includes value
  given:
  - a result status is returned
  when:
  - no value is present
  then:
  - schema validation rejects the result object
- id: AT-032
  name: P4 lane fallback remains dimension-aware inside profile
  given:
  - P4 phase_time_alignment fails
  when:
  - fallback applies
  then:
  - the selected fallback target is phase_monitoring, not an unrelated stronger or
    cross-lane label
- id: AT-033
  name: P6 local continuity does not imply UTC traceability
  given:
  - a P6 state uses local_private timescale and partition_local regime
  when:
  - it exports partition_local_coordination
  then:
  - the applicability remains local to the stated validity scope and does not imply
    UTC traceability
- id: AT-034
  name: manifest hashes cover archive files
  given:
  - MANIFEST.json contains file hashes
  when:
  - validation runs
  then:
  - each listed file hash matches the archive content and unlisted files are reported
- id: AT-035
  name: transport binding does not widen TimeState core
  given:
  - rev0063 defines semantic objects plus a transport envelope
  when:
  - an implementation needs concrete exchange carriage
  then:
  - it uses an adapter envelope
  - it does not add transport metadata to TimeState core
- id: AT-036
  name: transport envelope carries exactly one semantic payload
  given:
  - a TimeSync transport envelope is present
  when:
  - message_type selects a payload schema
  then:
  - semantic_payload is validated as that single selected TimeSync object
  - the envelope does not create a bundle or session layer
- id: AT-037
  name: envelope metadata is not TimeState
  given:
  - an envelope contains sent_at, sequence, producer, or adapter metadata
  when:
  - a receiver evaluates local assessed state
  then:
  - those metadata fields are not used as interval, freshness, regime, source_posture,
    applicability, or profile_conformance
- id: AT-038
  name: adapter id must resolve in catalog
  given:
  - an envelope names an adapter id
  when:
  - the validator checks the envelope
  then:
  - the id resolves to transport/adapter-catalog.json
  - the message_type is allowed by that adapter's payload_types
- id: AT-039
  name: source-claim adapter cannot carry local assessment
  given:
  - timesync.adapter.source-claim-inband allows only wire_claim
  when:
  - an envelope uses it with local_assessed_state
  then:
  - semantic validation rejects the envelope
- id: AT-040
  name: payload signature does not substitute for profile reference digest
  given:
  - a detached retained export has signed payload integrity
  when:
  - the nested assessed profile needs a digest at the export boundary
  then:
  - the digest must still appear inside assessed_profile and bind normative_profile_rules
- id: AT-041
  name: signed profile binding is not an envelope binding strength
  given:
  - an envelope attempts to set binding_strength to signed_profile_binding
  when:
  - schema validation runs
  then:
  - the envelope is rejected because signed profile binding belongs in assessed_profile.binding
- id: AT-042
  name: retained export requires retained local state
  given:
  - message_type is retained_assessment_export
  when:
  - semantic_payload.local_assessed_state lacks retention_context.retained true
  then:
  - semantic validation rejects the export
- id: AT-043
  name: capability advertisement is descriptive not negotiation
  given:
  - a capability_advertisement lists supported message types and profiles
  when:
  - a receiver reads it
  then:
  - it may guide requests
  - it does not establish profile conformance or a native negotiation protocol
- id: AT-044
  name: relay gateway envelope preserves boundary context semantics
  given:
  - a relay gateway carries local_assessed_state after restatement
  when:
  - boundary_context.action is restate
  then:
  - upstream conformance is not preserved across the relay
  - the downstream local assessed state stands on its own
- id: AT-045
  name: transport binding is below profile evaluator evidence
  given:
  - the adapter layer defines carriage
  when:
  - a reviewer asks why profile_conformance was reached
  then:
  - the answer is not supplied by the adapter layer
  - evaluator evidence summaries, not transport adapters, explain profile-assessment
    decisions
- id: AT-046
  name: evaluator evidence summary is scoped to one profile assessment
  given:
  - a local assessed state contains a profile assessment
  when:
  - an evidence summary is exported
  then:
  - it names the same assessed_profile
  - it names the same assessment_time
  - its conclusion_binding matches profile_conformance and applicability
- id: AT-047
  name: evidence summary is not a provenance graph
  given:
  - a retained export includes evaluator evidence
  when:
  - schema validation runs
  then:
  - source roster, path history, clock algorithm, and raw observations are not accepted
    as summary fields
- id: AT-048
  name: transport metadata cannot satisfy profile evidence obligations
  given:
  - an envelope has integrity metadata
  when:
  - a summary tries to use transport_metadata_only for a profile obligation
  then:
  - semantic validation rejects the summary
- id: AT-049
  name: retained P3 export requires evidence summary
  given:
  - a retained export assesses P3 at a tier-3 audit boundary
  when:
  - no matching evidence_input_summary is present
  then:
  - semantic validation rejects the export
- id: AT-050
  name: same TimeState may differ by profile evidence obligation
  given:
  - one TimeState is assessed under P1 and P3
  when:
  - P1 only needs coarse logging but P3 needs traceability evidence
  then:
  - P1 may be satisfied while P3 is unsatisfied
- id: AT-051
  name: profile digest includes evidence policy
  given:
  - a profile map contains evidence_policy
  when:
  - normative_rules_digest is recomputed
  then:
  - the digest covers the evidence policy as part of normative profile rules
- id: AT-052
  name: evidence summary is returned through flat request result only
  given:
  - a requester asks for evaluator_evidence_summary
  when:
  - a responder returns the summary
  then:
  - it appears as one flat result item
  - it does not create a bundle, session, or negotiation layer
- id: AT-053
  name: evidence summary conclusion mismatch is rejected
  given:
  - a retained export contains a local assessment and an evidence summary
  when:
  - the summary conclusion_binding names a different applicability
  then:
  - semantic validation rejects the retained export
- id: AT-054
  name: evidence summary binds by stable assessment id
  given:
  - a profile assessment has assessment_id
  when:
  - an evidence summary is exported or retained
  then:
  - conclusion_binding.assessment_id matches the profile assessment
  - assessment_index_hint is only advisory
- id: AT-055
  name: profile minimum summary items are enforced
  given:
  - a resolved profile declares evidence_policy.minimum_summary_items
  when:
  - an evidence summary omits one required minimum item
  then:
  - semantic validation rejects the summary
- id: AT-056
  name: unauthenticated source claim cannot satisfy a met obligation
  given:
  - an evidence class catalog marks unauthenticated_source_claim as non-satisfying
  when:
  - a summary marks an obligation met using only that class
  then:
  - semantic validation rejects the summary
- id: AT-057
  name: discovery returned evidence summaries are nested validated
  given:
  - a discovery result returns evaluator_evidence_summary
  when:
  - the nested summary is malformed
  then:
  - semantic validation rejects the discovery result
- id: AT-058
  name: exact profile compatibility requires identical digests
  given:
  - a profile compatibility statement uses relation exact_equivalent
  when:
  - subject and related normative digest values differ
  then:
  - semantic validation rejects the statement
- id: AT-059
  name: profile alias compatibility requires involved authority signature
  given:
  - a profile compatibility statement uses relation alias_for
  when:
  - the binding issuer is neither profile authority
  then:
  - semantic validation rejects the statement
- id: AT-060
  name: rendered profile markdown digest tracks catalog digest
  given:
  - a profile markdown page renders a sha256 normative digest
  when:
  - validation runs
  then:
  - the rendered digest must match profiles/profile-catalog.json
- id: AT-061
  name: timescale realization stays outside TimeState core
  given:
  - a TimeState uses the core timescale field
  when:
  - a profile needs named UTC realization, leap handling, or smear details
  then:
  - those details appear under extension_hooks.timescale_realization
  - the TimeState six-field core is unchanged
- id: AT-062
  name: named UTC traceability requires realization detail
  given:
  - traceability_posture.reference_anchor is utc_named_realization
  when:
  - timescale_realization is missing or unqualified
  then:
  - semantic validation rejects a satisfied profile assessment
- id: AT-063
  name: smear semantics must agree across realization and continuity hooks
  given:
  - timescale_realization.leap_handling is smeared
  when:
  - clock_continuity_posture.smear_policy says none or not_applicable
  then:
  - semantic validation rejects the state
- id: AT-064
  name: discovery validates returned realization and continuity hooks
  given:
  - a discovery result returns timescale_realization or clock_continuity_posture
  when:
  - the returned hook value violates its schema
  then:
  - semantic validation rejects the discovery result
- id: AT-065
  name: source diversity stays outside TimeState core
  given:
  - a TimeState reports source_posture only as a compact core field
  when:
  - a profile needs common-mode dependency information
  then:
  - that detail appears under extension_hooks.source_diversity_posture
  - the TimeState six-field core is unchanged
- id: AT-066
  name: single source cannot claim independent multi-root diversity
  given:
  - timestate.source_posture is single_source
  when:
  - source_diversity_posture claims multiple_independent_roots
  then:
  - semantic validation rejects the state
- id: AT-067
  name: same-root multi-source cannot claim common-mode mitigation
  given:
  - source_diversity_posture.dependency_class is multiple_sources_same_root
  when:
  - common_mode_risk is mitigated_by_diversity
  then:
  - semantic validation rejects the state
- id: AT-068
  name: source-diversity hook does not export a source roster
  given:
  - a source_diversity_posture value is exported
  when:
  - it includes source_roster or similar roster detail
  then:
  - schema validation rejects the state
- id: AT-069
  name: discovery validates returned source-diversity hook
  given:
  - a discovery result returns source_diversity_posture
  when:
  - the returned hook value violates its schema
  then:
  - semantic validation rejects the discovery result
- id: AT-0068-VALIDITY-HORIZON
  name: Validity horizon is profile-assessment scoped and cannot use export time as
    freshness
  given: a retained or replayed profile assessment with validity_horizon
  when: the evaluator checks current_actionability and export_time_role
  then: current_actionability must agree with policy_acceptance and export_time_role
    used_as_freshness_basis is rejected
- id: AT-0070-AUTHORIZED-CHALLENGE-BOUNDARY
  name: Authorized verifier challenge result is detached from ordinary TimeSync evidence
  given: a redacted evidence item bound to a salted commitment
  when: an authorized verifier obtains salt or preimage material through an external
    channel
  then: the TimeSync challenge result may record the match and receipt but must not
    carry the salt or preimage in ordinary exchange
- id: AT-0070-CHALLENGE-NOT-PROFILE-EVIDENCE
  name: Challenge results cannot satisfy profile obligations
  given: an authorized_verifier_disclosure evidence class
  when: a summary uses it as profile_obligation evidence
  then: semantic validation rejects the evidence summary
- id: AT-0070-CHALLENGE-TARGET-BINDING
  name: Challenge results must bind to an existing redacted commitment
  given: an authorized verifier challenge result and referenced evidence summary
  when: the target commitment does not appear in the referenced summary
  then: semantic validation rejects the challenge record
- id: AT-0071-CHALLENGE-PORTABILITY-SCOPE
  name: Challenge-result portability is limited to commitment verification
  given: a detached authorized verifier challenge result
  when: the result is replayed or copied
  then: it may be used only to verify the same commitment binding and not to satisfy
    profile evidence, current actionability, or reassessment
- id: AT-0071-CHALLENGE-REVOCATION-CHECK
  name: Usable portable challenge results require a current non-revoked status
  given: a challenge result with portable_result_state.current_status usable_for_commitment_verification_only
  when: revocation_check.status is revoked or not_checked
  then: semantic validation rejects the challenge result
- id: AT-0071-CHALLENGE-REPLAY-TARGET-BINDING
  name: Challenge-result replay must keep the original summary, assessment, and profile
    digest
  given: a replay_context for an authorized verifier challenge result
  when: the replay target changes summary_id, assessment_id, or assessed_profile digest
  then: semantic validation rejects the replay context
- id: AT-0071-CROSS-OPERATOR-PORTABILITY-COMPATIBILITY
  name: Cross-operator challenge portability requires a profile compatibility statement
    digest
  given: portability_boundary.portable_result_scope is cross_operator_with_profile_compatibility
  when: no profile_compatibility_statement digest is present
  then: semantic validation rejects the challenge record
- id: AT-0071-COMPATIBILITY-WORKFLOW-STRENGTH
  name: Profile compatibility statements may name challenge portability only without
    weakening evidence policy
  given: compatible_workflows includes authorized_verifier_challenge_result_portability
  when: evidence_policy_relation is weaker or unknown
  then: semantic validation rejects the profile compatibility statement
- id: AT-0072-REPLAY-TRANSPARENCY-ANCHOR
  name: Replay transparency receipts require an included and consistent anchor
  given: a challenge-result replay transparency receipt
  when: anchor_kind is not_logged or inclusion/consistency is not confirmed
  then: semantic validation rejects the receipt
- id: AT-0072-REPLAY-TRANSPARENCY-NON-UPGRADE
  name: Replay transparency cannot upgrade replay use or profile evidence
  given: a replay transparency receipt or evidence summary item
  when: it is used as profile evidence, current actionability, or reassessment
  then: semantic validation rejects the record
- id: AT-0072-AGGREGATE-VERIFIER-PRIVACY
  name: Aggregate verifier audit summaries suppress small groups and identities
  given: an aggregate verifier audit summary
  when: counts are below the minimum group size or verifier identity is exported
  then: semantic or schema validation rejects the summary
- id: AT-0072-DISCOVERY-REPLAY-TRANSPARENCY
  name: Discovery validates returned replay-transparency records
  given: a discovery result returns replay_transparency_receipt or aggregate_verifier_audit_summary
  when: the returned value violates the replay-transparency schema
  then: semantic validation rejects the discovery result
- id: AT-0073-ANCHOR-FRESHNESS-CURRENT-VISIBILITY
  name: fresh anchor required for current replay visibility
  given:
  - a replay-transparency receipt exports a transparency anchor for an authorized-verifier
    replay event
  when:
  - the receipt claims current replay visibility
  then:
  - anchor_evaluation reports a fresh anchor at the evaluation time
  - stale or unchecked anchors are historical or unknown only
  - anchor freshness does not update the underlying profile assessment
- id: AT-0073-CHECKPOINT-CONSISTENCY-BOUNDARY
  name: checkpoint consistency status is summary-only
  given:
  - a replay-transparency receipt names a checkpoint or append-only anchor
  when:
  - consistency is checked
  then:
  - the exported record may report checked_consistent, not_checked, failed, or not_applicable
  - it does not export Merkle proof material or transparency-service internals
  - failed or unchecked consistency cannot be current replay visibility
- id: AT-0073-SPLIT-VIEW-NON-PROVENANCE
  name: split-view signals do not become provenance or profile evidence
  given:
  - a conflicting transparency view is reported or suspected
  when:
  - TimeSync exports replay-transparency metadata
  then:
  - the conflict is represented as a bounded status only
  - conflict details, verifier identities, salts, preimages, and log internals are
    not exported
  - the allegation does not update TimeState, profile conformance, actionability,
    or TimeSync provenance
- id: AT-0074-WITNESS-COHORT-THRESHOLD
  name: Witness and monitor posture is threshold-bounded replay metadata
  given:
  - a replay-transparency receipt includes witness_cohort_evaluation
  when:
  - it claims witnessed_consistent, monitor_cohort_observed, or combined_witness_and_monitor_consistent
  then:
  - checkpoint consistency is checked_consistent
  - independent threshold posture is met
  - witness and monitor identities, rosters, dependency details, proof material, logs,
    and gossip transcripts are not exported
- id: AT-0074-WITNESS-DISAGREEMENT-NONCURRENT
  name: Witness or monitor disagreement cannot be current replay visibility
  given:
  - a replay-transparency receipt includes a witness or monitor disagreement signal
  when:
  - current_visibility_status is current_at_evaluation
  then:
  - semantic validation rejects the receipt
- id: AT-0074-MONITOR-COHORT-AGGREGATE-PRIVACY
  name: Aggregate monitor-cohort coverage suppresses small groups
  given:
  - an aggregate verifier audit summary includes monitor_cohort_coverage
  when:
  - monitor and witness observation counts are below the minimum group size
  then:
  - the summary is suppressed and exports no monitor roster, identity, cohort detail,
    or gossip transcript
- id: AT-0074-WITNESS-COHORT-NOT-PROFILE-EVIDENCE
  name: Witness cohort summaries cannot satisfy profile obligations
  given:
  - an evaluator evidence summary uses witness_cohort_summary
  when:
  - a profile obligation is marked met using that class
  then:
  - semantic validation rejects the summary
- id: AT-0076-POLICY-LIFECYCLE-CURRENT
  name: current replay visibility requires active non-revoked non-drifted policy lifecycle
  given:
  - a replay-transparency receipt references a digest-bound transparency trust policy
  when:
  - current replay visibility is asserted
  then:
  - the trust-policy lifecycle is active and inside its validity window
  - revocation status is checked_not_revoked
  - drift status is known and non-weakening
  - lifecycle metadata does not update TimeState, profile conformance, or actionability
- id: AT-0076-POLICY-LIFECYCLE-NON-UPGRADE
  name: policy lifecycle equivalence remains replay-visibility only
  given:
  - a compatibility statement asserts replay-transparency policy equivalence
  when:
  - the subject or related policy expires, is revoked, or drifts weaker
  then:
  - current replay-visibility equivalence is rejected
  - the statement does not become profile evidence, provenance, trust-anchor export,
    or reassessment authority
- id: AT-0077-POLICY-AUTHORITY-SEQUENCING
  name: current replay visibility requires fresh monotonic lifecycle-authority status
  given:
  - a replay-transparency receipt references a digest-bound transparency trust policy
  - the trust-policy reference includes lifecycle_authority_reference
  when:
  - current replay visibility is asserted
  then:
  - lifecycle-authority discovery is known or compatibility-bound
  - monotonicity is monotonic_checked
  - rollback_status is no_rollback_detected
  - freeze_check.status is fresh
  - status age is within max_status_age_seconds
  - repository topology, status endpoints, APIs, and trust-anchor material are not
    exported
- id: AT-0077-POLICY-RENEWAL-HINT
  name: renewal hints are advisory and sequence-bound
  given:
  - a lifecycle_authority_reference includes renewal_hint
  when:
  - hint_state is successor_digest_available or renewal_available
  then:
  - successor_policy_digest is present
  - expected_next_sequence is greater than the current sequence_number
  - the hint does not export repository topology
  - the hint does not update profile assessment or TimeSync provenance
- id: AT-0077-POLICY-AUTHORITY-NON-UPGRADE
  name: lifecycle-authority and sequence equivalence remain replay-visibility only
  given:
  - a replay-transparency policy-equivalence compatibility statement includes sequence_equivalence
  when:
  - subject or related sequence status is unchecked, stale, rolled back, or weaker_or_unknown
  then:
  - current replay-visibility equivalence is rejected
  - the authority or sequence posture does not become profile evidence, actionability
    evidence, trust-anchor export, or provenance
- id: AT-0078-POLICY-AUTHORITY-ROTATION
  name: current replay visibility requires known lifecycle-authority rotation posture
  given:
  - a replay-transparency receipt references a transparency trust-policy lifecycle
    authority
  when:
  - current replay visibility is asserted
  then:
  - rotation_state is not unknown_or_redacted
  - planned rotations carry a successor_authority_digest
  - rotation/delegation posture updates replay visibility only
  - authority key material, rosters, rotation protocol, and delegation chains are
    not exported
- id: AT-0078-POLICY-AUTHORITY-DELEGATION
  name: delegated lifecycle authority posture is scoped and digest-bound
  given:
  - a lifecycle authority delegates status or revocation publication
  when:
  - the posture is used for current replay visibility
  then:
  - delegation_scope is concrete
  - delegation_digest is present
  - delegation does not become profile evidence, actionability evidence, or TimeSync
    provenance
- id: AT-0078-POLICY-AUTHORITY-COMPROMISE
  name: unresolved lifecycle-authority compromise cannot support current replay visibility
  given:
  - a lifecycle authority compromise is suspected, unresolved, or unknown
  when:
  - current replay visibility is asserted
  then:
  - semantic validation rejects the record
  - contained compromise requires recovery/successor digest, response digest, and
    no current replay-visibility effect
- id: AT-0078-POLICY-AUTHORITY-ROTATION-EQUIVALENCE
  name: cross-operator authority rotation equivalence remains replay-visibility only
  given:
  - a profile compatibility statement asserts replay-transparency policy lifecycle
    equivalence
  when:
  - authority rotation, delegation, or compromise-response equivalence is weaker or
    unknown
  then:
  - current replay-visibility equivalence is rejected
  - the equivalence does not export authority rosters, key material, delegation chains,
    incident forensics, or provenance
- id: AT-0079-POLICY-AUTHORITY-RECOVERY-CURRENT
  name: recovered-current replay visibility requires current recovery attestation
  given:
  - a lifecycle authority compromise response is confirmed_contained
  when:
  - current replay visibility is asserted
  then:
  - recovery_attestation_reference is present
  - replay_visibility_effect is recovered_current
  - attestation_status is current
  - the incident window is bounded
  - recovery posture updates replay visibility only
- id: AT-0079-POLICY-AUTHORITY-RECOVERY-HISTORICAL
  name: historical or contested recovery posture cannot become current replay visibility
  given:
  - a recovery attestation reports historical_only or contested_visibility
  when:
  - a receipt asserts current_at_evaluation replay visibility
  then:
  - semantic validation rejects the record
  - the historical or contested receipt may remain retained as non-current replay
    visibility
- id: AT-0079-POLICY-AUTHORITY-RECOVERY-PORTABILITY
  name: cross-operator recovery-attestation portability is compatibility-bound
  given:
  - a recovery attestation is reused outside the issuing operator
  when:
  - portability.operator_scope is compatible_operator_bound
  then:
  - compatibility_statement_digest is present
  - no authority rosters, key material, incident forensics, legal details, or provenance
    are exported
- id: AT-0082-AGGREGATE-CORRECTION-LINEAGE
  name: corrected aggregate publications are prior-digest bound and non-rewriting
  given:
  - an aggregate verifier audit summary declares aggregate_revision_lineage.status
    corrected
  when:
  - the publication is validated
  then:
  - prior_aggregate_digest binds aggregate_verifier_audit_summary
  - previous_publication_sequence is lower than publication_sequence
  - prior_publication_rewritten is false
  - correction does not update profile assessment, actionability, individual replay
    visibility, or TimeSync provenance
- id: AT-0082-AGGREGATE-RECONCILIATION-PRIVACY
  name: longitudinal reconciliation does not expose suppressed deltas
  given:
  - an aggregate verifier audit summary declares aggregate_revision_lineage.status
    reconciled
  when:
  - the reconciliation covers prior aggregate publication windows
  then:
  - previous_chain_digest and chain_head_digest bind aggregate_publication_revision_chain
  - adjacent exact windows are not exported
  - suppressed deltas and individual result identifiers are not exported
  - reconciliation updates aggregate replay-visibility posture only
- id: AT-0082-AGGREGATE-REVISION-EVIDENCE-BOUNDARY
  name: aggregate revision-lineage summaries are not profile evidence
  given:
  - an evaluator evidence summary includes aggregate_revision_lineage_summary
  when:
  - the item is used_for profile_obligation
  then:
  - semantic validation rejects the summary
  - aggregate correction lineage remains aggregate publication metadata only
- id: AT-0083-CORRECTION-AUTHORITY-AUTHORIZED
  name: corrected aggregate publications require authorized correction authority
  given:
  - an aggregate verifier audit summary declares aggregate_revision_lineage.status
    corrected
  when:
  - correction_authority_reference is validated
  then:
  - authorization_status is authorized
  - authority_role matches the revision-lineage status
  - authority digest is present
  - authority rosters, key material, repository topology, and legal details are not
    exported
- id: AT-0083-CORRECTION-NOTIFICATION-CURRENT
  name: current aggregate correction interpretation requires notification within policy
  given:
  - a corrected, withdrawn, superseded, or reconciled aggregate publication is exported
  when:
  - the correction lineage is used for current aggregate interpretation
  then:
  - notification_state is notified_within_policy or deferred_but_within_policy
  - last_notification_at is not before issued_at
  - max_notification_delay_seconds is not exceeded
  - stale or unknown notification does not support current aggregate interpretation
- id: AT-0083-CORRECTION-CHAIN-PORTABILITY
  name: compatible-operator correction chains require digest-bound authority equivalence
  given:
  - an aggregate correction chain is interpreted by a compatible operator
  when:
  - portability_boundary is checked
  then:
  - operator_scope is compatible_operator_digest_bound
  - authority_equivalence is digest_bound_equivalent_or_stricter
  - compatibility_statement_digest is present
  - portable_correction_chain_digest is present
  - correction-chain portability does not update profile assessment, actionability,
    individual replay visibility, or TimeSync provenance
- id: AT-0084-CORRECTION-LIFECYCLE-CURRENT
  name: current aggregate correction interpretation requires active non-revoked lifecycle
  given:
  - an aggregate verifier audit summary carries authority_lifecycle
  when:
  - the lifecycle is used for current aggregate interpretation
  then:
  - lifecycle_state is active or guarded pending_rotation
  - revocation_status is not_revoked
  - revocation_checked_at is present
  - emergency withdrawal is not active
  - contestation is none or resolved_upheld with digest binding
  - lifecycle metadata updates aggregate replay-visibility interpretation only
- id: AT-0084-EMERGENCY-AND-CONTESTATION-NONCURRENT
  name: emergency withdrawal and unresolved contestation suppress current aggregate
    interpretation
  given:
  - a correction-authority lifecycle reports emergency withdrawal or contested status
  when:
  - the aggregate publication is interpreted
  then:
  - emergency withdrawal requires withdrawal digest and suppression
  - pending, overturned, or unknown contestation requires contestation digest
  - current aggregate interpretation is rejected
  - response plans, incident forensics, legal details, and contesting parties are
    not exported
- id: AT-0085-LIFECYCLE-DECISION-TABLE
  name: aggregate lifecycle decisions are derived from an executable table
  given:
  - a lifecycle-bearing correction-authority reference includes decision_table_digest
    and current_interpretation_decision
  when:
  - semantic validation evaluates the reference
  then:
  - the decision table enumerates the complete decision vocabulary
  - required rows for active, pending-rotation, expired, revoked, emergency, contested,
    and unknown lifecycle are present
  - the explicit decision matches the derived posture
  - the table does not become an authority registry or provenance graph
- id: AT-0085-EMERGENCY-RESYNCHRONIZATION
  name: emergency withdrawal resynchronization is summary-only and digest-bound
  given:
  - an emergency-withdrawn correction-authority lifecycle includes a concrete resynchronization
    state
  when:
  - the aggregate lifecycle posture is validated
  then:
  - withdrawal_digest binds aggregate_emergency_withdrawal_record
  - resynchronization_policy_digest binds aggregate_emergency_resynchronization_policy
    when resynchronization is concrete
  - current interpretation is suppressed
  - notification recipients, delivery-channel details, response plans, and exact incident
    timing are not exported
- id: AT-0085-LIFECYCLE-ROLLUP-PORTABILITY
  name: lifecycle rollups expose aggregate decisions without de-suppression or authority
    identity leakage
  given:
  - an aggregate verifier audit summary includes aggregate_correction_authority_lifecycle_rollup
  when:
  - rollup decision populations and portability aggregation are evaluated
  then:
  - digest_bindings include aggregate_lifecycle_decision_table
  - current-supported rollups do not contain suppressed decision populations
  - compatible-operator portability requires profile compatibility digest
  - authority identities, rosters, incident times, and notification recipients are
    not exported
- id: AT-0085-TIMESTAMP-ROLE-ORDERING
  name: aggregate artifact creation time bounds lifecycle and notification observations
  given:
  - an aggregate verifier audit summary has aggregate_record_created_at
  when:
  - authorization, lifecycle, revocation, and notification observation times are validated
  then:
  - authorization_checked_at is not after aggregate_record_created_at
  - lifecycle_checked_at is not after aggregate_record_created_at
  - revocation_checked_at is not after aggregate_record_created_at
  - last_notification_at is not after aggregate_record_created_at
  - publication event time is not confused with artifact creation time
- id: AT-0085-EXTERNAL-RECEIPT-AND-DISCLOSURE-CONTROL
  name: external receipt and disclosure-control references are digest-bound aggregate
    metadata only
  given:
  - an aggregate verifier audit summary includes external_transparency_receipt_reference
    and statistical_disclosure_control_reference
  when:
  - the references are validated
  then:
  - validated external receipts include checkpoint and receipt digests
  - disclosure-control posture binds an aggregate privacy policy digest
  - privacy budget and raw population sizes are not exported
  - receipt/log operator identities, monitor identities, and raw log entries are not
    exported
  - neither reference updates profile assessment or TimeSync provenance
- id: AT-0085-PNT-RISK-UTC-HOOKS
  name: PNT risk and UTC transition posture remain extension hooks outside TimeState
  given:
  - a P5 or P6 local assessed state includes pnt_risk_posture or extended timescale_realization
    fields
  when:
  - profile-specific evidence is interpreted
  then:
  - PNT disruption and manipulation posture is summary-only
  - UTC transition and smear policy fields are optional digest-bound hooks
  - the six-field TimeState core is unchanged
  - profile rules decide whether absence, warning, or redaction affects actionability
- id: AT-0086-PORTABLE-DIGEST-BINDING
  name: current-use TimeSync-owned digests are RFC 8785-bound and not legacy Python serialization
  given:
  - a discovery result or policy surface declares a current-use digest binding
  when:
  - semantic validation evaluates digest_binding metadata or digest_binding_policy rules
  then:
  - canonical JSON current bindings use json_canonicalization_scheme_rfc8785
  - sha256 is the digest algorithm for TimeSync-owned surfaces
  - legacy Python sort-keys serialization is historical-only
  - digest binding does not update profile assessment, actionability, or TimeSync provenance
- id: AT-0086-BYTE-ENVELOPE-BINDING
  name: external signed statements and receipts bind bytes before payload parsing
  given:
  - a discovery result returns an external receipt or statement reference
  when:
  - the result uses external_byte_envelope or external_receipt_bytes binding
  then:
  - payload type is authenticated
  - bytes are verified before payload parse
  - signature validation does not depend on JSON canonicalization
  - raw payload bytes are not exported by default
- id: AT-0086-SEMANTIC-VERSION-NEGOTIATION
  name: unknown newer discovery result versions cannot be accepted as current semantics
  given:
  - a request advertises supported semantic versions for returned items
  when:
  - a responder returns a newer or unsupported semantic_version
  then:
  - accepted_exact is rejected unless the version was explicitly supported
  - accepted_unknown_newer is rejected for current-use items
  - metadata-only, omitted, rejected, or downgraded handling remains allowed
  - negotiation metadata cannot update profile assessment or actionability

- id: AT-0087-PROFILE-COMPATIBILITY-DRIFT
  name: profile compatibility drift fails closed unless equivalent or stricter-or-equal
  given:
  - a profile compatibility statement carries compatibility_drift
  when:
  - the drift class, digest relation, evidence policy relation, and decision are validated
  then:
  - equivalent drift may be current
  - stricter-or-equal drift may be current only as guarded and digest-bound
  - weaker, unknown, incomparable, or unproven digest-rollover drift cannot support current compatibility use
  - the drift decision updates compatibility interpretation only
- id: AT-0087-DISCOVERY-DOWNGRADE-PROOF
  name: current-use discovery downgrade requires proof and stronger-or-equal semantics
  given:
  - a discovery result uses version_negotiation.decision downgraded_to_supported
  when:
  - the result is marked current_use_allowed
  then:
  - source_semantic_version and selected_semantic_version are present
  - selected_semantic_version is supported by the request when the request listed supported versions
  - downgrade_proof_digest binds profile_downgrade_proof
  - stronger_or_equal_semantics is true
  - weaker_or_unknown downgrade basis is rejected
- id: AT-0087-PROFILE-RENDER-CONSISTENCY
  name: rendered profile Markdown forbidden evidence classes match the normative catalog
  given:
  - profiles/profile-catalog.json lists evidence classes that cannot satisfy obligations
  when:
  - profile Markdown files are validated
  then:
  - each rendered profile includes every forbidden class from the catalog
  - Markdown remains non-normative but cannot silently omit non-satisfying evidence classes
- id: AT-0088-SCOPE-COMPOSITION-GUARD
  name: mixed-layer scope-composition guard fails closed across local-safe metadata
  given:
  - a scope-composition guard composes profile drift, discovery negotiation, digest binding, aggregate lifecycle, lifecycle rollup, and transparency policy surfaces
  when:
  - any composed surface is non-current, suppressed, historical-only, or out of scope
  then:
  - the guard cannot allow current use
  - the guard cannot update TimeState, profile assessment, profile conformance, actionability, or TimeSync provenance
  - lifecycle suppression, profile drift suppression, and downgrade-proof requirements cannot be bypassed by another surface
- id: AT-0088-COMPOSITION-ATTACK-CORPUS
  name: mixed-layer attack corpus contains required suppression and non-upgrade cases
  given:
  - tests/mixed-layer-scope-composition.yaml
  when:
  - the decision matrix is validated
  then:
  - every required mixed-layer attack row is present
  - unsafe upgrade rows are blocked
  - only the safe separated-surface row may use current_use_guarded
- id: AT-0092-JCS-DIGEST-HARDENING
  name: current TimeSync digest surfaces fail closed on non-JCS/I-JSON edge cases
  given:
  - current-use digest-bound TimeSync-owned objects use the timesync-jcs-sha256-v1 profile
  when:
  - validation parses JSON and computes normative profile-rule digests
  then:
  - duplicate JSON member names are rejected before schema validation
  - current digest policy requires UTF-16 code-unit object-member ordering
  - unsafe numeric values are rejected for TimeSync-owned digest surfaces rather than being silently serialized by Python
  - the digest helper lives in tools/jcs.py instead of the monolithic validator
