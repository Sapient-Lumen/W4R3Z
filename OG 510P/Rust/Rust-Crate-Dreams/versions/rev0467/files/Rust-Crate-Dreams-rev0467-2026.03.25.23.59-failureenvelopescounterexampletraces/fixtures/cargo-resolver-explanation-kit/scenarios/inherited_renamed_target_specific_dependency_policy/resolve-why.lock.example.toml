schema_version = "0.1"
capture_scope = "target-specific-member-build"
evidence_inputs = ["cargo metadata", "manifest scan"]

[cargo]
version = "1.94.0-nightly"
channel = "nightly"

[workspace]
root_manifest = "Cargo.toml"
members = ["desktop", "common"]

[selection]
packages = ["desktop"]
targets = ["x86_64-pc-windows-msvc"]
all_targets = false

[resolver]
version = "3"
feature_unification = "selected"
incompatible_rust_versions = "fallback"
lockfile_pass_shape = "selected-compile-features"
