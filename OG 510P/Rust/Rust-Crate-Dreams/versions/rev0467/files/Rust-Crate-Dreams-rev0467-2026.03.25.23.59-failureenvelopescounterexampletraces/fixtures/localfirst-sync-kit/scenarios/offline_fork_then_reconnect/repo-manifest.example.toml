schema_version = "1"
repo_id = "repo.notes.alpha"
profile_id = "single_user_multi_device@1"
document_family = "notes"
redaction_mode = "support-safe"

[engine]
family = "automerge"
version = "0.5.x"
sync_assumption = "reliable_in_order_stream"

[store]
family = "sqlite"
snapshot_mode = "periodic_snapshot_plus_updates"
compaction_policy = "checkpoint_every_500_updates"

[transport]
family = "iroh"
protocol_id = "/localsync/automerge/1"
bootstrap_method = "endpoint_id"
relay_policy = "dedicated_preferred_public_dev_only"

[membership]
mode = "single_user"
epoch_required = false
