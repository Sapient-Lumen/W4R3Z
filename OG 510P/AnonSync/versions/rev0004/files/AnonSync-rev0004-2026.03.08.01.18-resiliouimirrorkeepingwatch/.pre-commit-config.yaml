repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: validate-repo
        name: validate-repo
        entry: python scripts/validate_repo.py
        language: system
        pass_filenames: false
      - id: generate-context-pack
        name: generate-context-pack
        entry: python scripts/generate_context_pack.py
        language: system
        pass_filenames: false
