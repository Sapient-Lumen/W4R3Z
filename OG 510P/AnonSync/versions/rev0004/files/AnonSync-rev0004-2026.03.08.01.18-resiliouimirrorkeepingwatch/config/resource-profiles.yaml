version: 1
profiles:
  desktop-balanced:
    intent: balanced desktop default
    transport_defaults:
      tor:
        connection_padding: auto
        circuit_padding: true
        reduced_connection_padding: false
        reduced_circuit_padding: false
      i2pd:
        enabled: true
        notransit: true
        share_percent: 0
        streaming_profile: bulk
    sync_defaults:
      direct_send_small_files: true
      direct_send_mem_limit_mb: 256
      fs_notifications: true
      rescan_interval_seconds: 600
      index_backend: sqlite_wal
      hashing: blake3
      placeholders_default: false
  desktop-throughput:
    intent: favor throughput on capable desktop or NAS nodes
    transport_defaults:
      tor:
        connection_padding: auto
        circuit_padding: true
        reduced_connection_padding: false
