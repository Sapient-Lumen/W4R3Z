version: 1
lan_discovery:
  default_enabled: true
  advertise_stable_share_ids: false
  beacon_semantics: invite_derived_rotating_token
  transports_exposed_to_user: false
  cadence_seconds:
    startup_burst: [0, 3, 10]
    network_change_burst: [0, 5, 15]
    steady_state_base: 30
    healthy_peer_backoff_ceiling: 300
    mobile_frugal_base: 60
  adaptation_rules:
    - "on_startup: emit_startup_burst"
    - "on_network_change: emit_network_change_burst"
    - "on_direct_peer_healthy: backoff_until_ceiling"
    - "on_no_peer_seen_for_active_invite: return_to_base_rate"
  privacy_guardrails:
    local_network_only: true
    include_transport_internal_status: false
    include_router_control_endpoints: false
    include_user_facing_share_ids: false
