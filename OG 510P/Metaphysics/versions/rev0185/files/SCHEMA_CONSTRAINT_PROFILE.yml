schema_constraint_profile_version: rev0185-schema-constraint-profile-v1
archive_version: rev0185
package: Metaphysics-rev0185-2026.05.26.05.18-debt-cube-lifecycle-prioritization-audit-refactor.zip
status: SCP4_schema_constraint_profile_checked; SC4_schema_conformance_checked
purpose: move from presence-only schemas toward typed, enumerated, cross-reference-aware, semantic-invariant-aware
  schemas without claiming full migration
minimum_constraints_for_new_rev0181_schemas:
- required_fields
- field_constraints.archive_version.const
- field_constraints.package.const
- source_artifacts items_must_exist
- forbidden_claim_language min_items
- next_review_trigger non_empty
migration_classes:
- class_id: presence_only_legacy
  meaning: schema lists required fields only; still accepted for legacy records
- class_id: constraint_profiled_new
  meaning: schema includes type/enum/cross-reference/semantic-invariant notes; locally checked for new rev0184 families
- class_id: machine_enforced_future
  meaning: not yet achieved; would require full JSON Schema, SHACL, or equivalent validation
strong_schema_targets:
- field type
- allowed enum values
- status-token validity
- date format
- non-empty evidence arrays
- cross-reference existence
- minimum row counts
- unique IDs
- forbidden wording
- current release/package match
- valid control-step link
- allowed historical-reference fields
not_claimed:
- full JSON Schema migration
- SHACL validation
- complete semantic correctness
- all historical schema strengthening complete
source_artifacts:
- SCHEMA_CONSTRAINT_PROFILE.yml
- REGISTERS/schemas/current-release-record-v1.yml
- tools/check_schema_constraints.py
allowed_claim_language: rev0185 adds a local schema-constraint profile for new current-release families while legacy
  schemas may remain presence-only
forbidden_claim_language:
- all schemas strongly typed
- SHACL validation complete
- JSON Schema validation complete
- semantic correctness guaranteed
open_schema_constraint_debt:
- legacy schemas remain mostly presence-only
- no JSON Schema export
- no SHACL shapes graph
- limited semantic invariant enforcement
next_review_trigger: new schema family, failed current-release check, JSON/RDF export attempt, or semantic-invariant
  claim
