freshness_policy_version: rev0185-freshness-policy-v2
archive_version: rev0185
package: Metaphysics-rev0185-2026.05.26.05.18-debt-cube-lifecycle-prioritization-audit-refactor.zip
status: FRS2_freshness_windows_declared; FRS3_freshness_policy_assigned; FRS4_staleness_trigger_named; FRS5_freshness_report_passed
scope: freshness windows for local release claims, evidence packets, and external-analogy boundaries
freshness_policies:
- freshness_id: FRESH-LOCAL-PACKAGE
  applies_to: local package structure, current records, local validator output, local query reports
  freshness_basis: current package bytes and fresh-extraction validation
  review_window: per release; invalidated by any package byte change, manifest mismatch, validator change, or report
    regeneration
  status: FRS3_freshness_policy_assigned
  cannot_support:
  - external source currency
  - domain factual currency
- freshness_id: FRESH-EXTERNAL-ANALOGY
  applies_to: external framework descriptions used as design analogies
  freshness_basis: source anchors captured in EXTERNAL_CROSSWALK.yml and release notes
  review_window: review when analogy is converted into stronger compliance/interoperability claim or when source
    is known to change
  status: FRS4_staleness_trigger_named
  cannot_support:
  - compliance certification
  - current implementation review
- freshness_id: FRESH-PUBLIC-USE
  applies_to: public summaries, public reliance packets, derivative teaching or decision-support claims
  freshness_basis: explicit public-use review only
  review_window: blocked in this release unless a public-use packet and current source review are added
  status: FRS2_freshness_windows_declared
  cannot_support:
  - public reliance by default
  - operational readiness
- freshness_id: FRESH-SOURCE-CURRENT
  applies_to: claims about external facts, laws, products, standards, APIs, living people, institutions, or current
    practices
  freshness_basis: fresh external source review
  review_window: not satisfied by this package unless separate dated source review is added
  status: FRS2_freshness_windows_declared
  cannot_support:
  - implicit currentness from local validation
allowed_claim_language: local freshness rules distinguish package-current claims from source-current and public-use
  claims
forbidden_claim_language:
- automated freshness watch
- current external fact review
- public reliance freshness
- source currency by default
open_freshness_debt:
- no source-watch automation
- no external-currentness report
- freshness is policy-coded but not calendar-enforced
