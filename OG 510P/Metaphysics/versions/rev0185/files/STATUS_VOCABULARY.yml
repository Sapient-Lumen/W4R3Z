allowed_claim_language: rev0185 status vocabulary includes claim-observation-index, claim-relation, claim-audit,
  and claim-cube-refactor status families
forbidden_claim_language:
- status token proves external compliance
- status token proves semantic correctness
- status token proves accessibility or comprehension
open_vocabulary_debt:
- historical records are not normalized
- status values remain scalar in many records
- no public concept scheme
- release gate vocabulary is local, not policy-as-code standardization
- status vocabulary remains local and not externally governed
- security and abuse-resistance status families are local and not mapped to CVSS, CWE, ATT&CK, OWASP, or NIST control
  identifiers
- legal/reuse vocabulary is local and not legal advice, SPDX conformance, REUSE conformance, or OpenChain compliance
- ethics/public-interest vocabulary is local and not mapped to law, institutional review, public deliberation, or
  fairness-audit standards
- claim/cube-refactor vocabulary is local and not a formal claim graph standard
not_claimed:
- formal verification
- public CI
- external QA
- operational safety case
