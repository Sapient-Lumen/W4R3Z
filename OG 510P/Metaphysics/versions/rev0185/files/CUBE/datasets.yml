allowed_claim_language: rev0185 defines local cube datasets for artifacts, claims, claim relations, claim audits,
  debts, debt relations, debt audits, controls, sources, source relations, source audits, access, concepts, concept
  relations, and cube audits
forbidden_claim_language:
- RDF Data Cube publication
- public endpoint
- semantic completeness
- external validation
- source-currentness guaranteed
open_cube_dataset_debt:
- YAML local only
- no RDF/JSON-LD cube export
- no public endpoint
- no independent review
- concept/source relation semantics are provisional
- SourceCube has no live URL validation
- claim relation semantics are provisional
- claim audit is structural only
- debt relation semantics are provisional
- debt audit is structural only
- no owner-assignment or debt-closure claim follows
next_review_trigger: new observation dataset, external publication, query regression failure, source-currentness
  claim, or semantic claim expansion
