archive_version: rev0185
package: Metaphysics-rev0185-2026.05.26.05.18-debt-cube-lifecycle-prioritization-audit-refactor.zip
status: DTX4_debt_taxonomy_checked; DCF4_debt_cube_refactor_checked
purpose: turn repeated open-debt prose into typed, queryable debt observations
debt_families:
- family: external_review_absent
  severity: high
  blocking_status: blocks_external_audit_or_compliance_claims
  closure_condition: documented independent review with scope, findings, and retained limitations
- family: public_service_absent
  severity: high
  blocking_status: blocks_public_support_or_helpdesk_claims
  closure_condition: public support process with owner, SLA/SLO boundaries, and incident path
- family: accessibility_evidence_absent
  severity: high
  blocking_status: blocks accessibility conformance, assistive-technology, or inclusive-access claims
  closure_condition: planned test rows become completed results with method, artifact, finding, and limitation
- family: source_watch_absent
  severity: medium
  blocking_status: blocks source-currentness claims
  closure_condition: source review cadence, owner, diff, and last-checked evidence
- family: semantic_correctness_unproven
  severity: medium
  blocking_status: blocks philosophical completeness and semantic correctness claims
  closure_condition: concept hard cases, rival comparison, negative controls, and review outcomes recorded
- family: schema_strength_absent
  severity: medium
  blocking_status: blocks strong machine-validation claims
  closure_condition: typed schemas, enum constraints, cross-reference checks, and semantic invariants executed
- family: publication_export_absent
  severity: medium
  blocking_status: blocks RDF, RO-Crate, Data Package, OSCAL, SPDX, CycloneDX, or SLSA claims
  closure_condition: export generated, validated, bounded, and linked to source artifacts
- family: user_testing_absent
  severity: high
  blocking_status: blocks comprehension, plain-language certification, and onboarding-complete claims
  closure_condition: reader tasks executed with participants or documented expert proxy and results
blocking_claim_map:
- claim_blocked: external audit complete
  debt_family: external_review_absent
- claim_blocked: WCAG conformant
  debt_family: accessibility_evidence_absent
- claim_blocked: source current
  debt_family: source_watch_absent
- claim_blocked: reader comprehension proven
  debt_family: user_testing_absent
- claim_blocked: RDF publication exists
  debt_family: publication_export_absent
- claim_blocked: semantic correctness guaranteed
  debt_family: semantic_correctness_unproven
open_debt_taxonomy_debt:
- debt family assignment is heuristic
- no owner assignment for most debts
- no closure evidence workflow beyond local rows
allowed_claim_language: rev0185 classifies recurring debt families and maps them to blocked claims with lifecycle
  and priority summaries
forbidden_claim_language:
- all debts closed
- debt severity externally verified
- debt owners assigned
- public release unblocked
next_review_trigger: new open debt, repeated debt phrase, public-use claim, or closure claim
