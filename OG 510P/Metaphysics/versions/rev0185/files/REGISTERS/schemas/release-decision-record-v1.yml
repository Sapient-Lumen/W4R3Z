schema_name: release-decision-record-v1
schema_version: 1
status: local_archive_schema
scope: rev0169 release gate, decision, waiver, risk acceptance, and assurance governance
required_fields:
- release_decision_id
- archive_version
- package
- decision_ledger_artifact
- decision_count
- gate_result_count
- decision_status
- check_tool
- report_artifact
- allowed_claim_language
- forbidden_claim_language
- open_decision_debt
- next_decision_review_trigger
forbidden_inferences:
- external approval
- signed attestation
- operational release authority
- public CI
- formal assurance conformance
