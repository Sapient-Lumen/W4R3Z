schema_name: control-stack-record-v1
schema_version: 1
status: local_archive_schema
scope: canonical_control_stack_mapping_and_drift_boundary
required_fields:
- control_stack_record_id
- archive_version
- package
- control_stack_artifact
- covered_steps
- final_step
- stack_status
- artifact_requirements
- validator_checks
- drift_hazards
- allowed_claim_language
- forbidden_claim_language
- open_control_stack_debt
- next_control_stack_trigger
control_stack_statuses:
  CST0: no control-stack claim
  CST1: prose sequence only
  CST2: current final step named
  CST3: local control-stack artifact present
  CST4: control-stack checked by validator
  CST5: control-stack drives artifact checks
  CST6: control-stack drift regression
  CST7: external or independent control-stack review
  CST8: multi-custodian control-stack governance
  CST9: false or unsafe control-stack claim
claim_boundary:
  may_support:
  - local_control_stack_map_present
  - current_final_step_named
  - control_stack_structure_checked
  must_not_imply:
  - complete_drift_detection
  - external_review
  - public_change_control
  - public_governance_infrastructure
