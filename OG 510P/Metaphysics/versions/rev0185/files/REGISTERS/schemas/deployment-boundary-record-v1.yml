schema_name: deployment-boundary-record-v1
schema_version: 1
status: local_archive_schema
scope: operational_reliance_deployment_boundary_action_use
required_fields:
- deployment_boundary_id
- artifact_version
- package_name
- predecessor_package
- governing_file
- runbook
- source_material
- proposed_operational_context
- intended_action
- affected_parties_or_systems
- semantic_fidelity_record
- public_use_status
- stewardship_status
- continuity_status_if_any
- automation_status_if_any
- deployment_status
- action_reliance_class
- domain_review_status
- source_current_status
- human_review_gate
- override_path
- notice_dispute_appeal_path
- correction_or_rollback_path
- monitoring_or_watch_requirement
- permitted_actions
- forbidden_actions
- incident_triggers
- allowed_claim_language
- forbidden_claim_language
- open_deployment_debt
- next_deployment_review_trigger
deployment_statuses:
- OP0_no_operational_claim
- OP1_orientation_only
- OP2_internal_conceptual_aid
- OP3_training_simulation_or_teaching_practice_only
- OP4_low_stakes_local_workflow_aid
- OP5_controlled_decision_support_use
- OP6_source_or_domain_bound_operational_use
- OP7_externally_governed_deployment
- OP8_monitored_public_or_institutional_deployment
- OP9_unsafe_unauthorized_or_deployment_laundered_use
action_reliance_classes:
- AR0_no_action_reliance
- AR1_interpretive_orientation
- AR2_archive_local_routing
- AR3_reversible_low_impact_maintenance_action
- AR4_human_reviewed_decision_support
- AR5_process_affecting_institutional_support
- AR6_domain_sensitive_action
- AR7_automated_or_embedded_action
- AR8_forbidden_or_unbounded_action
claim_boundary:
  may_support:
  - local_operational_boundary_recorded
  - action_reliance_class_declared
  - allowed_and_forbidden_action_language_declared
  - operational_debt_visible
  must_not_imply:
  - domain_authority
  - legal_medical_engineering_financial_or_safety_advice
  - institutional_policy_adoption
  - public_monitoring_active
  - automated_action_deployment_active
  - current_source_compliance
  - affected_party_notice_process_active_without_evidence
