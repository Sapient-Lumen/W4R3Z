schema_name: evidence-custody-record-v1
schema_version: 1
status: local_archive_schema
scope: rev0170 reproducibility, attestation boundary, custody, execution log, rollback, and public release packet
  governance
required_fields:
- evidence_custody_id
- archive_version
- package
- custody_artifact
- evidence_item_count
- digest_checked_count
- custody_status
- check_tool
- report_artifact
- allowed_claim_language
- forbidden_claim_language
- open_custody_debt
- next_custody_review_trigger
forbidden_inferences:
- bit-for-bit reproducible build
- signed attestation
- legal chain of custody
- public CI
- external approval
- operational deployment readiness
