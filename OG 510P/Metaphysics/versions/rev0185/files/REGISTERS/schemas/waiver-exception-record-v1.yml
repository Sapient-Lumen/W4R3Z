schema_name: waiver-exception-record-v1
schema_version: 1
status: local_archive_schema
scope: rev0169 release gate, decision, waiver, risk acceptance, and assurance governance
required_fields:
- waiver_exception_id
- archive_version
- package
- waiver_ledger_artifact
- waiver_count
- active_waiver_count
- waiver_status
- check_tool
- report_artifact
- allowed_claim_language
- forbidden_claim_language
- open_waiver_debt
- next_waiver_review_trigger
forbidden_inferences:
- external approval
- signed attestation
- operational release authority
- public CI
- formal assurance conformance
