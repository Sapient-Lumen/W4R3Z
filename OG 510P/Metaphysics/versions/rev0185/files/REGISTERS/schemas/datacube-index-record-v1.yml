schema_name: datacube-index-record-v1
schema_version: 1
status: local_archive_schema
scope: local_datacube_index_observation_family_dimension_measure_attribute_query_boundary
required_fields:
- datacube_record_id
- archive_version
- package
- cube_artifact
- control_stack_artifact
- observation_families
- dimension_families
- measure_families
- attribute_families
- query_examples
- coverage_status
- validation_status
- allowed_claim_language
- forbidden_claim_language
- open_cube_debt
- next_cube_review_trigger
datacube_statuses:
  DC0: no cube claim
  DC1: cube metaphor only
  DC2: observation families named
  DC3: dimensions measures attributes named
  DC4: local cube index present
  DC5: current-release observations enumerated
  DC6: cross-release observations enumerated
  DC7: executable query harness
  DC8: externally interoperable cube
  DC9: false or unsafe cube claim
query_permission_classes:
  QRY0: no query claim
  QRY1: artifact lookup
  QRY2: current required-field query
  QRY3: current status/debt query
  QRY4: control-stack query
  QRY5: local source-boundary query
  QRY6: cross-release lineage query
  QRY7: executable regression query
  QRY8: public/interoperable query
  QRY9: unsafe query or forbidden inference
claim_boundary:
  may_support:
  - local_cube_index_present
  - current_release_observations_listed
  - dimensions_measures_attributes_named
  must_not_imply:
  - public_rdf_cube
  - public_query_service
  - complete_observation_layer
  - source_currency
  - domain_authority
  - operational_readiness
