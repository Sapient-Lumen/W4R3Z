schema_name: assurance-case-record-v1
schema_version: 1
status: local_archive_schema
scope: rev0169 release gate, decision, waiver, risk acceptance, and assurance governance
required_fields:
- assurance_case_id
- archive_version
- package
- assurance_case_artifact
- top_claim_count
- argument_count
- assurance_status
- check_tool
- report_artifact
- allowed_claim_language
- forbidden_claim_language
- open_assurance_debt
- next_assurance_review_trigger
forbidden_inferences:
- external approval
- signed attestation
- operational release authority
- public CI
- formal assurance conformance
