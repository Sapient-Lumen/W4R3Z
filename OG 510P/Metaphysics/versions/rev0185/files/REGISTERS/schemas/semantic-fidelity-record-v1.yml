schema_name: semantic-fidelity-record-v1
schema_version: 1
status: local_archive_schema
scope: semantic_fidelity_generated_output_warning_retention
required_fields:
- semantic_fidelity_id
- artifact_version
- package_name
- predecessor_package
- governing_file
- runbook
- source_material
- output_artifact_or_type
- intended_audience
- intended_use
- compression_level
- automation_status_if_any
- tool_permission_class_if_any
- semantic_fidelity_status
- warning_retention_class
- fidelity_dimensions_checked
- warnings_retained
- warnings_omitted
- transformations_performed
- known_fidelity_risks
- human_review_boundary
- allowed_reuse
- forbidden_reuse
- correction_or_withdrawal_triggers
- open_semantic_fidelity_debt
- next_semantic_fidelity_review_trigger
semantic_fidelity_statuses:
- SF0_no_fidelity_claim
- SF1_loose_orientation
- SF2_caveat_retaining_summary
- SF3_warning_retaining_teaching_output
- SF4_dossier_faithful_applied_output
- SF5_precedent_and_transfer_faithful_output
- SF6_source_and_version_faithful_output
- SF7_independently_reviewed_semantic_fidelity_output
- SF8_public_use_fidelity_warranted_output
- SF9_failed_unsafe_or_fidelity_laundered_output
warning_retention_classes:
- WR0_no_warning_retained
- WR1_return_path_warning_retained
- WR2_status_warning_retained
- WR3_non_verdict_retained
- WR4_rival_or_defeater_retained
- WR5_source_and_version_boundary_retained
- WR6_public_use_and_stewardship_boundary_retained
- WR7_high_stakes_or_domain_boundary_retained
- WR8_warning_failure
fidelity_dimensions:
- target_fidelity
- route_fidelity
- basis_fidelity
- status_fidelity
- non_verdict_fidelity
- warning_fidelity
- rival_fidelity
- version_fidelity
- source_fidelity
- compression_fidelity
- visual_fidelity
- audience_fidelity
claim_boundary:
  may_support:
  - local_semantic_fidelity_review_recorded
  - warning_retention_class_declared
  - output_reuse_limits_declared
  - local_generated_output_audit_performed
  must_not_imply:
  - independent_semantic_certification
  - all_outputs_semantically_verified
  - source_currency_established
  - public_derivative_monitoring_active
  - public_use_fidelity_warranted_without_public_use_packet
  - domain_authority
  - machine_proof_of_semantic_faithfulness
