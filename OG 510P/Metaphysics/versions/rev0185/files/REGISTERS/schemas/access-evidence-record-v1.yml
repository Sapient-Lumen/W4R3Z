schema_id: access-evidence-record-v1
schema_version: v1
required_fields:
- record_id
- archive_version
- package
- status
- scope
- source_artifacts
- allowed_claim_language
- forbidden_claim_language
- next_review_trigger
- open_debt
field_constraints:
  archive_version:
    const: rev0184
  package:
    const: Metaphysics-rev0184-2026.05.26.03.46-claim-cube-warrant-defeasance-audit-refactor.zip
  source_artifacts:
    type: array
    min_items: 1
  forbidden_claim_language:
    type: array
    min_items: 1
  open_debt:
    type: array
additional_notes: rev0184 adds type/enum-style metadata, but validator still performs structural local checks only
  unless a dedicated checker is invoked
