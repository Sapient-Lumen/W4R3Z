- validation_id
- artifact_checked
- version_identity
- schema_or_checklist
- validation_status
- check_mode
- inputs_inspected
- invariant_families_checked
- checks_passed
- checks_failed
- checks_not_run
- failure_severity
- exceptions_or_waivers
- human_review_boundary
- remediation_action
- closure_evidence
- allowed_claim_language
- forbidden_claim_language
- next_validation_trigger
- open_validation_debt
validation_statuses:
