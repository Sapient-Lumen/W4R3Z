  I2: file_continuity
  I3: index_and_front_door
  I4: manifest_and_package
  I5: packet_chain
  I6: status_vocabulary
  I7: source_boundary
  I8: public_claim
  I9: exception_and_waiver
  I10: automation_boundary
failure_severities:
  S0: observation_only
  S1: local_warning
  S2: repair_before_public_summary
  S3: repair_before_release
  S4: release_hold
  S5: quarantine
  S6: rollback_withdrawal_or_retraction_trigger
  S7: unsafe_validation_claim
automation_boundary:
  may_check:
  - version_alignment
  - file_number_continuity
  - readme_archive_index_and_start_here_inclusion
