schema_name: rollback-retraction-record-v1
schema_version: 1
status: local_archive_schema
scope: rev0170 reproducibility, attestation boundary, custody, execution log, rollback, and public release packet
  governance
required_fields:
- rollback_retraction_id
- archive_version
- package
- rollback_plan_artifact
- trigger_count
- retraction_target_count
- rollback_status
- check_tool
- report_artifact
- allowed_claim_language
- forbidden_claim_language
- open_rollback_debt
- next_rollback_review_trigger
forbidden_inferences:
- bit-for-bit reproducible build
- signed attestation
- legal chain of custody
- public CI
- external approval
- operational deployment readiness
