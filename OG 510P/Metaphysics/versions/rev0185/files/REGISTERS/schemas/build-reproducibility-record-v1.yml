schema_name: build-reproducibility-record-v1
schema_version: 1
status: local_archive_schema
scope: rev0170 reproducibility, attestation boundary, custody, execution log, rollback, and public release packet
  governance
required_fields:
- build_reproducibility_id
- archive_version
- package
- build_ledger_artifact
- build_count
- input_artifact_count
- generated_artifact_count
- reproducibility_status
- check_tool
- report_artifact
- allowed_claim_language
- forbidden_claim_language
- open_reproducibility_debt
- next_reproducibility_review_trigger
forbidden_inferences:
- bit-for-bit reproducible build
- signed attestation
- legal chain of custody
- public CI
- external approval
- operational deployment readiness
