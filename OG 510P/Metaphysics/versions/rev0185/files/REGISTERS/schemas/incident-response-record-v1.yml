schema_id: incident-response-record-v1
schema_purpose: 'Local vocabulary for incident-response, harm-review, near-miss, evidence-preservation, recovery,
  and closure records in the Metaphysics Archive.

  '
boundary: 'This schema supports local package memory only. It does not create public incident intake, domain authority,
  external safety review, legal process, affected-party notice, or public monitoring.

  '
required_fields:
- incident_id
- archive_version
- implicated_artifact
- discovery_route
- incident_status
- harm_severity
- recovery_class
- affected_scope
- governing_packets
- evidence_preserved
- containment_action
- recovery_action
- closure_status
- residual_risk
- successor_memory_trigger
incident_status_values:
  INC0: no incident
  INC1: observation or weak signal
  INC2: benign confusion or low-impact misunderstanding
  INC3: near miss
  INC4: local maintenance incident
  INC5: public reliance or derivative-use incident
  INC6: operational-use incident
  INC7: domain-sensitive incident
  INC8: systemic governance incident
  INC9: unsafe uncontained or unrecoverable incident
harm_severity_values:
  H0: no harm identified
  H1: local inconvenience
  H2: warning or citation defect
  H3: reliance frustration
  H4: reversible operational effect
  H5: affected-party burden
  H6: domain-sensitive risk
  H7: material harm or irreversible effect
  H8: systemic recurrence risk
  H9: unknown or unbounded harm
recovery_class_values:
  RC0: no recovery action
  RC1: local clarification
  RC2: register update
  RC3: correction or erratum
  RC4: rollback or restoration
  RC5: withdrawal or deprecation
  RC6: notice and affected-party path
  RC7: source or domain review
  RC8: governance revision
  RC9: unresolved or unsafe
forbidden_inferences:
- schema presence proves incident monitoring
- incident record proves affected-party notice
- local classification proves domain closure
- closure record proves no harm occurred
- successful recovery proves future deployment safety
- absence of incident records proves no incidents exist
