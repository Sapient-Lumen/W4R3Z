schema_name: workflow-run-record-v1
schema_version: 1
status: local_archive_schema
scope: release_workflow_execution_trace
required_fields:
- workflow_id
- artifact_version
- package_name
- predecessor_package
- runbook
- release_class
- workflow_status
- responsible_role
- stages
- validation_result
- manifest_result
- fresh_extraction_result
- handoff_summary
- allowed_claim_language
- forbidden_claim_language
- open_workflow_debt
- next_workflow_trigger
stage_required_fields:
- stage_id
- stage_name
- entry_criteria
- actions_taken
- evidence_artifacts
- result
- skipped_or_waived
- exit_criteria
allowed_workflow_statuses:
- WF0_no_workflow_claim
- WF1_informal_remembered_workflow
- WF2_runbook_exists_not_executed
- WF3_partial_execution_trace
- WF4_local_runbook_executed
- WF5_validation_integrated_workflow
- WF6_handoff_ready_workflow
- WF7_reproducible_workflow_recipe
- WF8_independently_reexecuted_workflow
- WF9_failed_unsafe_or_workflow_laundered
claim_boundary:
  may_support:
  - local_workflow_trace_included
  - runbook_included
  - validation_integrated_local_release
  - handoff_limits_recorded
  must_not_imply:
  - independent_external_review
  - public_ci_active
  - public_issue_tracker_active
  - source_watch_automation_active
  - philosophical_truth_validated_by_script
  - domain_authority
