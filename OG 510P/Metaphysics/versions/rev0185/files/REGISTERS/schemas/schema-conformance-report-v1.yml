schema_name: schema-conformance-report-v1
schema_version: 1
status: local_archive_schema
scope: schema_conformance_profile_required_field_report
required_fields:
- conformance_report_id
- archive_version
- package
- profile_scope
- schemas_inspected
- records_checked
- records_excluded
- check_mode
- conformance_status
- profile_rule
- failures_found
- remediation_actions
- allowed_claim_language
- forbidden_claim_language
- open_conformance_debt
- next_conformance_trigger
conformance_statuses:
  SC0: no conformance claim
  SC1: schema named only
  SC2: manual field review
  SC3: scripted required-field check
  SC4: scripted profile-aware check
  SC5: schema plus status-vocabulary check
  SC6: schema plus cross-artifact reference check
  SC7: query-regression checked
  SC8: independently reproduced conformance
  SC9: failed unsafe or conformance-laundered
claim_boundary:
  may_support:
  - current_release_required_field_conformance
  - profile_boundary_visible
  - local_schema_report_included
  must_not_imply:
  - metaphysical_truth
  - source_currency
  - domain_authority
  - independent_audit
  - public_validation_service
  - full_historical_conformance
