record_type: risk_portfolio
schema: REGISTERS/schemas/risk-portfolio-record-v1.yml
required_fields:
- portfolio_id
- archive_version
- package
- portfolio_scope
- included_items
- explicit_exclusions
- portfolio_status
- exposure_aggregation_class
- correlation_common_cause_class
- priority_treatment_class
- concentrations
- cumulative_burden
- accepted_residual_risks
- blocked_or_escalated_items
- allowed_claim_language
- forbidden_claim_language
- next_review_trigger
- owner_or_declined_responsibility
- open_portfolio_debt
portfolio_status_classes:
  PF0: no portfolio claim
  PF1: informal cluster noted
  PF2: local portfolio inventory
  PF3: exposure-mapped portfolio
  PF4: correlation-reviewed portfolio
  PF5: prioritized treatment portfolio
  PF6: release-gated portfolio
  PF7: cross-cycle portfolio review
  PF8: independently/domain-reviewed portfolio
  PF9: unmanaged overloaded or unsafe portfolio
exposure_aggregation_classes:
  EXP0: not aggregated
  EXP1: count-only aggregation
  EXP2: family aggregation
  EXP3: artifact aggregation
  EXP4: audience/use aggregation
  EXP5: dependency aggregation
  EXP6: burden aggregation
  EXP7: correlated-exposure aggregation
  EXP8: public/domain-sensitive exposure aggregation
  EXP9: aggregation impossible or misleading
correlation_common_cause_classes:
  COR0: correlation not assessed
  COR1: apparently independent
  COR2: shared wording dependency
  COR3: shared maintainer or reviewer dependency
  COR4: shared artifact dependency
  COR5: shared source-current dependency
  COR6: shared workflow or tool dependency
  COR7: shared use-pressure dependency
  COR8: cascading/common-mode failure likely
priority_treatment_classes:
  PRI0: no treatment decision
  PRI1: accept local residual risk
  PRI2: monitor only
  PRI3: clarify or reword
  PRI4: consolidate or automate locally
  PRI5: source refresh or domain review required
  PRI6: public-use or deployment block
  PRI7: deprecate migrate or quarantine
  PRI8: incident/learning escalation
  PRI9: release stop
evidence_source_types:
- release packet
- lineage packet
- provenance packet
- review packet
- public-reliance packet
- stewardship packet
- continuity register
- validation transcript
- workflow trace
- automation-boundary record
- semantic-fidelity record
- deployment-boundary record
- incident-response record
- post-incident-learning record
- effectiveness-monitoring record
- source-refresh record
- independent/domain review
- explicit absence of evidence
forbidden_inferences:
- public risk management established
- cumulative risk proven low
- domain compliance assured
- independent portfolio audit completed
- derivative ecosystem monitored
- source-watch active
- operational deployment authorized
- affected-party notice provided
