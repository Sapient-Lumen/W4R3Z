record_type: effectiveness_monitoring
schema: REGISTERS/schemas/effectiveness-monitoring-record-v1.yml
required_fields:
- monitoring_id
- archive_version
- package
- target_item
- origin_layer
- monitoring_status
- effectiveness_class
- residual_risk_trend
- sunset_or_renewal_class
- evidence_sources
- review_trigger
- owner_or_declined_responsibility
- allowed_claim_language
- forbidden_claim_language
- escalation_route
- closure_or_renewal_evidence
- open_monitoring_debt
monitoring_status_classes:
  MON0: no monitoring claim
  MON1: monitoring proposed
  MON2: local successor-memory watch
  MON3: release-cycle review
  MON4: derivative/transmission review
  MON5: deployment/public-reliance review
  MON6: source-refresh watch
  MON7: incident/near-miss watch
  MON8: active maintained control
  MON9: monitoring unsafe or impossible
effectiveness_classes:
  EFF0: no effectiveness claim
  EFF1: plausibility-only control
  EFF2: inspection-confirmed control
  EFF3: regression-confirmed control
  EFF4: transmission-confirmed control
  EFF5: workflow-confirmed control
  EFF6: deployment-confirmed control
  EFF7: repeated-cycle confirmation
  EFF8: independent/domain confirmation
  EFF9: effectiveness disconfirmed
residual_risk_trend_classes:
  RRT0: not assessed
  RRT1: unknown but bounded
  RRT2: decreasing
  RRT3: stable
  RRT4: transformed
  RRT5: migrated
  RRT6: increasing
  RRT7: unbounded
  RRT8: misclassified
sunset_or_renewal_classes:
  SUN0: no sunset stated
  SUN1: historical-retention only
  SUN2: review-before-reuse
  SUN3: time or release-cycle renewal
  SUN4: trigger-based renewal
  SUN5: absorbed into stronger control
  SUN6: superseded by revised control
  SUN7: retired after evidence
  SUN8: must not sunset yet
  SUN9: retired unsafely
evidence_source_types:
- existence evidence
- execution evidence
- regression evidence
- transmission evidence
- deployment evidence
- incident evidence
- source-refresh evidence
- independent/domain evidence
- explicit absence of evidence
forbidden_inferences:
- public monitoring active
- automated source-watch active
- derivative ecosystem monitored
- independent effectiveness audit completed
- domain compliance assured
- future incidents prevented
