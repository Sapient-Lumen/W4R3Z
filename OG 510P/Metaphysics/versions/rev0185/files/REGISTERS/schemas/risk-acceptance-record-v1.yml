schema_name: risk-acceptance-record-v1
schema_version: 1
status: local_archive_schema
scope: rev0169 release gate, decision, waiver, risk acceptance, and assurance governance
required_fields:
- risk_acceptance_id
- archive_version
- package
- risk_acceptance_artifact
- risk_acceptance_count
- accepted_boundary
- risk_acceptance_status
- check_tool
- report_artifact
- allowed_claim_language
- forbidden_claim_language
- open_risk_acceptance_debt
- next_risk_acceptance_review_trigger
forbidden_inferences:
- external approval
- signed attestation
- operational release authority
- public CI
- formal assurance conformance
