schema_name: release-gate-policy-record-v1
schema_version: 1
status: local_archive_schema
scope: rev0169 release gate, decision, waiver, risk acceptance, and assurance governance
required_fields:
- release_gate_policy_id
- archive_version
- package
- gate_policy_artifact
- gate_count
- blocking_gate_count
- gate_status
- check_tool
- report_artifact
- allowed_claim_language
- forbidden_claim_language
- open_gate_debt
- next_gate_review_trigger
forbidden_inferences:
- external approval
- signed attestation
- operational release authority
- public CI
- formal assurance conformance
