schema_id: reader-task-record-v1
schema_version: v1
required_fields:
- record_id
- archive_version
- package
- status
- scope
- source_artifacts
- allowed_claim_language
- forbidden_claim_language
- next_review_trigger
- reader_task_row_count
- open_reader_task_debt
field_constraints:
  archive_version:
    type: string
    const: rev0184
  package:
    type: string
    const: Metaphysics-rev0184-2026.05.26.03.46-claim-cube-warrant-defeasance-audit-refactor.zip
  status:
    type: string
    must_use_declared_status_tokens: true
  source_artifacts:
    type: array
    items_must_exist: true
  forbidden_claim_language:
    type: array
    min_items: 1
additional_notes: constraint-profiled rev0184 schema for reader-task record; validates presence and declares local
  field constraints
