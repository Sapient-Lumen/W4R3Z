schema_name: attestation-boundary-record-v1
schema_version: 1
status: local_archive_schema
scope: rev0170 reproducibility, attestation boundary, custody, execution log, rollback, and public release packet
  governance
required_fields:
- attestation_boundary_id
- archive_version
- package
- attestation_boundary_artifact
- attestation_count
- signature_state
- attestation_status
- check_tool
- report_artifact
- allowed_claim_language
- forbidden_claim_language
- open_attestation_debt
- next_attestation_review_trigger
forbidden_inferences:
- bit-for-bit reproducible build
- signed attestation
- legal chain of custody
- public CI
- external approval
- operational deployment readiness
