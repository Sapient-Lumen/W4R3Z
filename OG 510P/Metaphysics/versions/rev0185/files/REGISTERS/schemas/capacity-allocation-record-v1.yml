schema: capacity-allocation-record-v1
purpose: Local vocabulary for capacity planning, backlog admission, work-in-progress limits, deferral/resource-debt
  classification, and resource-basis records in the Metaphysics Archive.
scope: local archive governance only
non_authorities:
- public project management
- public issue tracking
- staffing commitment
- service-level commitment
- active source-watch operation
- public monitoring
- external review capacity
- domain authority
- legal compliance
- clinical governance
- engineering safety assurance
- financial suitability review
- operational maintenance
required_fields:
- capacity_packet_id
- archive_version
- package
- trigger
- scope
- non_scope
- capacity_status
- backlog_admission_class
- work_in_progress_class
- deferral_class
- resource_basis
- scarce_dependency
- owner_or_declined_responsibility
- next_action
- review_window_or_trigger
- wip_limit_or_queue_rule
- stop_condition
- allowed_claim_language
- forbidden_claim_language
- open_capacity_debt
classes:
  capacity_status:
    CAP0: no capacity claim
    CAP1: capacity need identified
    CAP2: local capacity plausibly available
    CAP3: capacity assigned with limits
    CAP4: capacity scheduled or staged
    CAP5: capacity executed with evidence
    CAP6: sustained local capacity
    CAP7: externally or domain supported capacity
    CAP8: capacity exceeded or unavailable
    CAP9: false or unsafe capacity claim
  backlog_admission:
    BL0: not admitted
    BL1: parking-lot note
    BL2: candidate item
    BL3: admitted local backlog item
    BL4: admitted release-candidate item
    BL5: release-blocking backlog item
    BL6: external or domain-review backlog item
    BL7: delegated backlog item
    BL8: rejected or de-scoped item
    BL9: unsafe backlog condition
  work_in_progress:
    WIP0: not started
    WIP1: exploratory work
    WIP2: active local edit
    WIP3: active cross-file propagation
    WIP4: awaiting evidence
    WIP5: blocked
    WIP6: paused with return trigger
    WIP7: completed with evidence
    WIP8: stale or zombie work
  deferral:
    DEF0: no deferral claim
    DEF1: harmless local deferral
    DEF2: deferred with warning
    DEF3: deferred with watch trigger
    DEF4: deferred with release debt
    DEF5: deferred with public-use restriction
    DEF6: deferred with deployment block
    DEF7: deferred to external or domain authority
    DEF8: deferral unsafe
    DEF9: abandoned without safe closure
allowed_claims:
- local capacity classification recorded
- backlog admission class stated
- work-in-progress class stated
- deferral or resource-debt class stated
- local runbook/schema/record present
forbidden_claims:
- public issue tracker exists
- staffing is guaranteed
- service level is guaranteed
- all risks are resourced
- source-watch operation exists
- public monitoring exists
- domain review has occurred
- operational maintenance is provided
