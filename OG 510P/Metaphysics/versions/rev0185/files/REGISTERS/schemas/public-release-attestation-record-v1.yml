schema_name: public-release-attestation-record-v1
schema_version: 1
status: local_archive_schema
scope: rev0170 reproducibility, attestation boundary, custody, execution log, rollback, and public release packet
  governance
required_fields:
- public_release_attestation_id
- archive_version
- package
- public_attestation_artifact
- positive_assertion_count
- negative_assertion_count
- signature_state
- public_attestation_status
- check_tool
- report_artifact
- allowed_claim_language
- forbidden_claim_language
- open_public_attestation_debt
- next_public_attestation_review_trigger
forbidden_inferences:
- bit-for-bit reproducible build
- signed attestation
- legal chain of custody
- public CI
- external approval
- operational deployment readiness
