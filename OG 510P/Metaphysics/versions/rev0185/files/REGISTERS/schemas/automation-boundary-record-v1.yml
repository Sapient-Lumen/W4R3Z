schema_name: automation-boundary-record-v1
schema_version: 1
status: local_archive_schema
scope: automation_boundary_agent_delegation_scheduled_execution_tool_permission
required_fields:
- automation_id
- artifact_version
- package_name
- predecessor_package
- governing_file
- runbook
- tool_or_agent_class
- permission_classes
- automation_status
- scheduled_execution_status
- authorized_scope
- prohibited_scope
- inputs_supplied
- outputs_produced
- files_touched
- registers_touched
- validation_result
- human_review_gate
- responsible_role
- evidence_artifacts
- allowed_claim_language
- forbidden_claim_language
- stop_or_escalation_triggers
- open_automation_debt
- next_automation_review_trigger
allowed_automation_statuses:
- AUTO0_no_automation_claim
- AUTO1_incidental_tool_use
- AUTO2_local_mechanical_assistance
- AUTO3_local_validation_assistance
- AUTO4_workflow_integrated_tool_assistance
- AUTO5_delegated_draft_or_transformation_assistance
- AUTO6_scheduled_local_watch_or_reminder
- AUTO7_public_or_multi_custodian_automation
- AUTO8_independently_reproduced_automated_workflow
- AUTO9_failed_unsafe_or_automation_laundered_artifact
permission_classes:
- TP0_no_tool_permission
- TP1_inspect_only
- TP2_mechanical_write_permission
- TP3_draft_write_permission
- TP4_controlled_edit_permission
- TP5_register_update_permission
- TP6_scheduled_trigger_permission
- TP7_public_action_permission
- TP8_destructive_or_irreversible_action_permission
scheduled_execution_classes:
- SCH0_no_schedule
- SCH1_personal_reminder
- SCH2_local_due_date_watch
- SCH3_local_scheduled_check
- SCH4_source_refresh_watch
- SCH5_public_notice_watch
- SCH6_derivative_fork_intake_watch
- SCH7_multi_custodian_scheduled_workflow
- SCH8_unsafe_or_overclaimed_schedule
claim_boundary:
  may_support:
  - local_tool_assistance_recorded
  - local_automation_boundary_declared
  - tool_permission_class_named
  - post_action_validation_run_when_recorded
  must_not_imply:
  - public_ci_active
  - public_issue_tracker_active
  - scheduled_source_monitoring_active
  - independent_automated_rebuild
  - external_audit_completed
  - philosophical_truth_automated
  - source_currency_automated
  - domain_authority
  - operational_warranty
