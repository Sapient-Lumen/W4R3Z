schema_name: acceptance-criteria-record-v1
schema_version: 1
status: local_archive_schema
scope: rev0169 release gate, decision, waiver, risk acceptance, and assurance governance
required_fields:
- acceptance_criteria_id
- archive_version
- package
- acceptance_matrix_artifact
- criteria_count
- blocking_criteria_count
- acceptance_status
- check_tool
- report_artifact
- allowed_claim_language
- forbidden_claim_language
- open_acceptance_debt
- next_acceptance_review_trigger
forbidden_inferences:
- external approval
- signed attestation
- operational release authority
- public CI
- formal assurance conformance
