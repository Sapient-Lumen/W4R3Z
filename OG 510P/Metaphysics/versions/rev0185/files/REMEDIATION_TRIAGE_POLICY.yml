routing_rules:
- when: undefined status token, missing reference, manifest mismatch, or failed gate
  then: assign SEV-0172-4 and block release claims until repaired
- when: public monitoring/SLA/support language appears
  then: assign SEV-0172-3 or SEV-0172-4 depending on release proximity and reopen claim-language review
- when: external reliance is reported
  then: assign SEV-0172-4 unless explicitly non-operational and bounded
allowed_claim_language: rev0185 retains local-only governance boundaries for REMEDIATION_TRIAGE_POLICY.yml and forbids
  external compliance, deployment, audit, accessibility-conformance, or public-support upgrades without explicit
  evidence
forbidden_claim_language:
- public helpdesk active
- incident-response duty accepted
- emergency remediation guaranteed
- legal triage completed
- all defects repaired
open_remediation_debt:
- triage is local/manual
- no public support desk
- no legal incident classifier
- no external remediation owner
next_remediation_review_trigger: any failed validator, failed query, public-overclaim, feedback item, downstream
  reliance report, or blocking drift anomaly
