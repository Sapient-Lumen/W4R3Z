<!doctype html>
<meta charset="utf-8">
<title>BrowserRT Jank Guillotine Seed</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.4; }
  #box { width: 64px; height: 64px; border-radius: 8px; background: #222; animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  button, input { font: inherit; margin: 0.25rem; }
  pre { background: #f4f4f4; padding: 1rem; overflow: auto; }
</style>
<h1>BrowserRT Jank Guillotine Seed</h1>
<p>This is a placeholder demo surface. Future revisions will wire it to BrowserRT workers and traces.</p>
<div id="box"></div>
<p><input id="typing" placeholder="Typing should remain responsive"></p>
<p>
  <button id="bad">Run bad main-thread loop</button>
  <button id="light">Run light traced action</button>
</p>
<pre id="log"></pre>
<script type="module">
  import { boot } from '../src/browserrt.mjs';
  const log = document.querySelector('#log');
  const rt = await boot({ demo: 'jank-guillotine-seed' });
  function write(message) { log.textContent += message + '
'; }
  write('Booted BrowserRT ' + rt.revision);
  document.querySelector('#bad').onclick = () => {
    const start = performance.now();
    while (performance.now() - start < 700) {}
    write('Main thread intentionally blocked for about 700 ms. Future demo compares this to worker mode.');
  };
  document.querySelector('#light').onclick = () => {
    rt.trace.emit('demo:light-action', { at: Date.now() });
    write(JSON.stringify(rt.trace.snapshot().slice(-2), null, 2));
  };
</script>
