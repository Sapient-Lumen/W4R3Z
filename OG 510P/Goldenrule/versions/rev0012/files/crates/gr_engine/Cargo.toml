[package]
name = "gr_engine"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "gr-engine"
path = "src/bin/gr-engine.rs"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.23", features = ["derive"] }
hex = "0.4.3"
rand = "0.8.5"
rand_chacha = "0.3.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
sha2 = "0.10.8"
thiserror = "1.0.69"

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.6.0"
