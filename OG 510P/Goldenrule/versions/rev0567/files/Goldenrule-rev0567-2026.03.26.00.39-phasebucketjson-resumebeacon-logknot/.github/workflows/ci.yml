name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Quick deterministic harness
        run: make test-quick
      - name: Upload timing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timing-artifacts
          path: artifacts/timing/
          if-no-files-found: error

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo fmt
        run: cargo fmt --check
      - name: Cargo test
        run: cargo test -p gr_engine

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile python
        run: python -m compileall -q grlab
      - name: Python unit tests
        run: python -m unittest discover -s grlab/tests
