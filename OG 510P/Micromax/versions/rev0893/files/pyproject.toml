[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micromax"
version = "0.0.8"
description = "micromax language + reference Python VM + micro-esque editor prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="micromax contributors"}]

[project.scripts]
micromax = "micromax.repl:main"
micromax-editor = "micromax_editor.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.6",
  "mypy>=1.8",
  "pre-commit>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"micromax.stdlib" = ["*.mx"]

[tool.setuptools.data-files]
"share/micromax/docs" = [
  "docs/00-vision.md",
  "docs/security-boundaries.md",
  "docs/01-llm-start-here.md",
  "docs/02-repo-map.md",
  "docs/20-language-design.md",
  "docs/21-language-spec-sketch.md",
  "docs/22-two-tier-execution.md",
  "docs/23-data-model.md",
  "docs/24-bytecode-format.md",
  "docs/26-modules-and-hooks.md",
  "docs/30-editor-integration.md",
  "docs/31-host-api.md",
  "docs/32-capabilities.md",
  "docs/32-undo-and-history.md",
  "docs/40-roadmap.md",
  "docs/41-decisions-log.md",
  "docs/42-portability-ledger.md",
  "docs/43-worklist.md",
  "docs/50-editor-behaviors.md",
  "docs/55-editor-command-bar.md",
  "docs/64-editor-prompt-completion.md",
