name: reproducible release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-unprivileged:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - name: Acquire hash-locked wheels, test one source, and reproduce outputs
        run: make repro-release

  build-and-attest:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the exact source generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the declared Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - name: Acquire hash-locked wheels, test one source, and reproduce outputs
        run: make repro-release
      - name: Sign hosted provenance for the verified release outputs
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            .artifacts/mxrepro/*.whl
            .artifacts/mxrepro/micromax-release-receipt.json
            .artifacts/mxrepro/micromax-repro-run.json
            .artifacts/mxrepro/Micromax-rev*.zip
      - name: Retain the exact attested files from this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: micromax-attested-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/mxrepro/*.whl
            .artifacts/mxrepro/micromax-release-receipt.json
            .artifacts/mxrepro/micromax-repro-run.json
            .artifacts/mxrepro/Micromax-rev*.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
