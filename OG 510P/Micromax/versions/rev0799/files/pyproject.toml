[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micromax"
version = "0.0.8"
description = "micromax language + reference Python VM + micro-esque editor prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="micromax contributors"}]

[project.scripts]
micromax = "micromax.repl:main"
micromax-editor = "micromax_editor.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.6",
  "mypy>=1.8",
  "pre-commit>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"micromax.stdlib" = ["*.mx"]
