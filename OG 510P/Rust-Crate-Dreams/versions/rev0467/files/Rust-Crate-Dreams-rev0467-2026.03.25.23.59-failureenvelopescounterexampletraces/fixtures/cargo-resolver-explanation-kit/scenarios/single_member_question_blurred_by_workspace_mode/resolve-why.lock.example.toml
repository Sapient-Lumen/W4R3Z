schema_version = "0.1"
capture_scope = "single-package-question"
evidence_inputs = ["cargo tree -e features -i syn -p leaf"]

[cargo]
version = "1.94.0-nightly"
channel = "nightly"

[workspace]
root_manifest = "Cargo.toml"
members = ["leaf", "helper"]

[selection]
packages = ["leaf"]
targets = ["x86_64-unknown-linux-gnu"]
all_targets = false

[resolver]
version = "3"
feature_unification = "workspace"
incompatible_rust_versions = "fallback"
lockfile_pass_shape = "selected-compile-features"
