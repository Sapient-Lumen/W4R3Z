schema_version = "0.1"
capture_scope = "workspace-check"
evidence_inputs = ["cargo metadata", "cargo tree -e features -d"]

[cargo]
version = "1.94.0-nightly"
channel = "nightly"

[workspace]
root_manifest = "Cargo.toml"
members = ["a", "b"]

[selection]
packages = ["a", "b"]
targets = ["x86_64-unknown-linux-gnu"]
all_targets = false

[resolver]
version = "3"
feature_unification = "selected"
incompatible_rust_versions = "fallback"
lockfile_pass_shape = "all-workspace-features"
