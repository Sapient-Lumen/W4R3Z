[sources]
policy = "vendored_offline"
allow_git = false
allow_path = false

[[sources.replace]]
from = "sparse+https://registry-x.example/index/"
to = "vendored-sources"

[[sources.replace]]
from = "sparse+https://registry-y.example/index/"
to = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
