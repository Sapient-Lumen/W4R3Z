[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lacuna-epistemic-ledger"
version = "0.169.0"
description = "An epistemic ledger for worlds that have not finished becoming true."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.18"]

[project.scripts]
lacuna = "lacuna.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
