[project]
name = "i2p-dht-lab"
version = "0.0.101"
description = "Consumer-agnostic Python design lab for a mutable DHT over I2P; rev0101 places mutable observations, provider-index buckets, and I2P route-storage entries after Python-owned record ingress; not production"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
