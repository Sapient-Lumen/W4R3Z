name: python-cloudtainer-lane
on:
  push:
  pull_request:
jobs:
  local-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest cryptography
      - run: scripts/ci/run_python_cloudtainer_lane.sh
