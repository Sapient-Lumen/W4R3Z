name: vision_demo
steps:
  - type: ImageSearchFile
    haystack_path: assets/hay.png
    needle_path: assets/needle.png
    threshold: 0.9
    out_x: x
    out_y: y
    out_score: score
  - type: Log
    message: "Image match at (${x}, ${y}) score=${score}"
  - type: OcrReadTextFile
    image_path: assets/ocr.png
    out_var: text
  - type: Log
    message: "OCR read: '${text}'"
