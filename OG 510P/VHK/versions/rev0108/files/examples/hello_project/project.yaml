name: hello_project
settings:
  # These influence the headless runner.
  # desktop_backend: auto|x11|wayland
  desktop_backend: auto
  log_dir: logs
  event_log: true
  screenshot_on_error: false
  panic_file: /tmp/vhk_panic

# Optional: used by `vhk gen-i3-config`.
bindings:
  - keys: "$mod+Shift+h"
    macro: hello
    description: "Run hello macro"

  # Example: context-sensitive binding (active window must match).
  - keys: "$mod+Shift+v"
    macro: vision_demo
    description: "Vision demo (only in Firefox)"
    when:
      class: "Firefox"

macros:
  hello: macros/hello.yaml
  vision_demo: macros/vision_demo.yaml
  call_demo: macros/call_demo.yaml
  child: macros/child.yaml
  pixel_demo: macros/pixel_demo.yaml
