name: call_demo
steps:
  - type: SetVar
    name: who
    value: "friend"
  - type: CallMacro
    macro: child
    args:
      who: "${who}"
    returns:
      child_result: from_child
  - type: Log
    message: "Got return: ${from_child}"
  - type: RandomWait
    min_ms: 10
    max_ms: 20
  - type: Log
    message: "Done."
