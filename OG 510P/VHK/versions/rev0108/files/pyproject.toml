[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vhk"
version = "0.22.75"
description = "VHK: VisualHotKey + PMC-class macro tooling for i3/X11 (engine + CLI scaffold)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "VHK Contributors"}]
keywords = ["automation", "i3", "x11", "macro", "ocr", "opencv"]
dependencies = [
  "typer>=0.9",
  "rich>=13",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "opencv-python>=4.7",
  "pillow>=10",
  "pytesseract>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
vhk = "vhk.cli:app"
vhk-emit = "vhk.emit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
