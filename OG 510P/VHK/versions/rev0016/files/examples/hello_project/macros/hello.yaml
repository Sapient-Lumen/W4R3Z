name: hello
steps:
  - type: SetVar
    name: name
    value: world
  - type: Log
    message: "Hello, ${name}!"
  - type: Delay
    ms: 50
  - type: If
    condition: "name == 'world'"
    then_steps:
      - type: Log
        message: "Condition true."
    else_steps:
      - type: Log
        message: "Condition false."
