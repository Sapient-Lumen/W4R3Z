[workspace]
resolver = "2"
members = [
    "anonssh-bond",
    "anonssh-bond-tokio",
    "anonssh-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["[[h0p3]]"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32", features = ["full", "test-util"] }
tracing = "0.1"
zeroize = { version = "1.6", features = ["derive", "serde"] }
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
getrandom = "0.2"
chacha20poly1305 = "0.10"
bytes = "1.11"
hkdf = "0.12"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }

# Keep disposable build trees small on developer machines.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
opt-level = 1
